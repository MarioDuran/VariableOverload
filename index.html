<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UNIX DOOM VR - TecGPT Campaign</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #info {
            text-align: center;
            z-index: 10;
            max-width: 980px;
            padding: 24px;
        }
        h1 {
            font-size: 80px;
            margin: 0;
            text-shadow: 0 0 15px #0f0;
            letter-spacing: 5px;
        }
        p { color: #55ff55; font-size: 18px; }
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #error-log { color: #ff0000; font-weight: bold; margin-top: 20px; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">
        <h1>START</h1>
        <p>↓ Pulsa ENTER VR abajo ↓</p>
        <p><b>Mando Izq:</b> Joystick mover | Grip correr | Gatillo disparar</p>
        <p><b>Mando Der:</b> Joystick girar | A/B/Joystick cambiar modo ARC | Gatillo disparar</p>
        <p>Campaña: enteros → flotantes → strings → booleanos → auto tipado.</p>
        <div id="error-log"></div>
    </div>

    <div id="game-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        try {
            // --- SISTEMA DE ARCHIVOS / CAMPAÑA ---
            const fsTree = {
                "/": ["home", "var", "etc", "kernel"],
                "/home": ["hacker"],
                "/home/hacker": ["payloads"],
                "/home/hacker/payloads": ["float_heap"],
                "/var": ["log"],
                "/var/log": ["string_leak"],
                "/etc": ["flags"],
                "/etc/flags": ["boolean_gate"],
                "/kernel": ["root_cause"],
                "/kernel/root_cause": []
            };

            const missions = [
                {
                    key: 'float',
                    route: '/home/hacker/payloads/float_heap',
                    unlock: 'float',
                    label: 'ARC-FLOAT',
                    intro: 'Mi sistema de conteo de referencias me indica que el virus está en la ruta /home/hacker/payloads/float_heap. Ve y elimina el virus.',
                    onUpgrade: 'Upgrade ARC-FLOAT instalado. Ahora puedes cambiar el modo de la pistola ARC y eliminar variables flotantes.'
                },
                {
                    key: 'string',
                    route: '/var/log/string_leak',
                    unlock: 'string',
                    label: 'ARC-STRING',
                    intro: 'Boss, el heap flotante quedó estable. TecGPT detecta corrupción de cadenas en /var/log/string_leak. Dirígete ahí y purga los strings infectados.',
                    onUpgrade: 'Pistola de strings sincronizada. Cambia al modo STRING para compilar a balazos esas cadenas corruptas.'
                },
                {
                    key: 'bool',
                    route: '/etc/flags/boolean_gate',
                    unlock: 'bool',
                    label: 'ARC-BOOL',
                    intro: 'Los strings dejaron de mutar. Ahora hay flags booleanas alterando permisos en /etc/flags/boolean_gate. Neutralízalas.',
                    onUpgrade: 'Módulo booleano cargado. El modo BOOL puede eliminar true y false infectados.'
                },
                {
                    key: 'auto',
                    route: '/kernel/root_cause',
                    unlock: 'auto',
                    label: 'ARC-AUTO',
                    intro: 'TecGPT ha identificado la raíz del problema en /kernel/root_cause. Prepárate: ahí convergen todas las variables.',
                    onUpgrade: 'Pistola de auto tipado obtenida. Este modo infiere el tipo del objetivo y daña cualquier variable.'
                }
            ];

            const allWeaponTypes = ['int', 'float', 'string', 'bool', 'auto'];
            const weaponColors = {
                int: 0x00ff00,
                float: 0x00ffff,
                string: 0xffff00,
                bool: 0xaa00ff,
                auto: 0xffffff
            };
            const weaponNames = {
                int: 'ARC-INT',
                float: 'ARC-FLOAT',
                string: 'ARC-STRING',
                bool: 'ARC-BOOL',
                auto: 'ARC-AUTO'
            };
            const typeLabels = {
                int: ['404', '1337', '-1', '0xFF'],
                float: ['3.14', 'NaN', '2.71', '∞.0'],
                string: ['"null"', '"DROP"', '"NaN"', '"EOF"'],
                bool: ['true', 'false', '!true', '0==1'],
                boss: ['OVERLOAD']
            };

            // --- THREE / VR ---
            let camera, scene, renderer;
            let playerDolly;
            let rightController = null;
            let leftController = null;
            let rightWeaponMesh = null;
            let leftWeaponMesh = null;
            let weaponMat = null;
            let gameOverMesh = null;
            let notificationMesh = null;

            // --- ESTADO DEL JUEGO ---
            let health = 100;
            let score = 0;
            let isGameOver = false;
            let isGameRunning = false;
            let stamina = 100;
            const MAX_STAMINA = 100;

            let clipAmmo = 36;
            const MAX_CLIP = 36;
            let reserveAmmo = 84;
            const MAX_RESERVE = 180;
            let isReloading = false;
            let rapidFireUntil = 0;

            let currentPath = '/';
            let unlockedWeapons = ['int'];
            let currentWeaponIndex = 0;
            let weaponSwitchCooldown = 0;
            let missionIndex = 0;
            let pendingWaveAfterUpgrade = false;
            let finalBossSpawned = false;
            let finalBossDefeated = false;

            const roomStates = new Map();
            const claimedUpgrades = new Set();

            // --- MAPA / ENTIDADES ---
            let mapGrid = [];
            const TILE_SIZE = 10;
            const GRID_SIZE = 15;
            let walls = [];
            let wallMeshes = [];
            let doors = [];
            let enemies = [];
            let dyingEnemies = [];
            let lasers = [];
            let pickups = [];

            let activeWave = null;
            let flowField = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(9999));
            let lastFlowFieldUpdate = 0;
            let lastHudUpdate = 0;
            let nextRandomSupplyTime = 0;
            let doorWarningCooldown = 0;

            const clock = new THREE.Clock();

            // --- HUD VR ---
            const hudCanvas = document.createElement('canvas');
            hudCanvas.width = 1280;
            hudCanvas.height = 320;
            const vrHudCtx = hudCanvas.getContext('2d');
            const vrHudTex = new THREE.CanvasTexture(hudCanvas);
            let vrHudMesh;

            // --- NOTIFICACIONES TecGPT ---
            const notificationCanvas = document.createElement('canvas');
            notificationCanvas.width = 1200;
            notificationCanvas.height = 260;
            const notificationCtx = notificationCanvas.getContext('2d');
            const notificationTex = new THREE.CanvasTexture(notificationCanvas);
            const notificationQueue = [];
            let activeNotification = null;
            let notificationStartTime = 0;

            // --- AUDIO ---
            let audioCtx;
            let listener;
            let bgm;

            init();

            function init() {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x000a00);
                scene.fog = new THREE.FogExp2(0x001100, 0.014);

                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 1.6, 0);

                const ambientLight = new THREE.AmbientLight(0x00aa00, 1.15);
                scene.add(ambientLight);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.xr.enabled = true;
                document.getElementById('game-container').appendChild(renderer.domElement);

                const vrButton = VRButton.createButton(renderer);
                vrButton.addEventListener('click', () => {
                    document.getElementById('info').style.display = 'none';
                    if (!isGameRunning) startGame();
                });
                document.body.appendChild(vrButton);

                playerDolly = new THREE.Group();
                scene.add(playerDolly);
                playerDolly.add(camera);

                const pointLight = new THREE.PointLight(0x00ff00, 1.5, 42);
                pointLight.position.set(0, 2, 0);
                playerDolly.add(pointLight);

                listener = new THREE.AudioListener();
                camera.add(listener);
                bgm = new THREE.Audio(listener);

                // HUD superior/inferior del visor.
                const hudGeo = new THREE.PlaneGeometry(1.9, 0.48);
                const hudMat = new THREE.MeshBasicMaterial({ map: vrHudTex, transparent: true, depthTest: false });
                vrHudMesh = new THREE.Mesh(hudGeo, hudMat);
                vrHudMesh.renderOrder = 999;
                vrHudMesh.position.set(0, 0.18, -1.25);
                vrHudMesh.rotation.x = -0.05;
                camera.add(vrHudMesh);

                const notificationGeo = new THREE.PlaneGeometry(1.85, 0.40);
                const notificationMat = new THREE.MeshBasicMaterial({ map: notificationTex, transparent: true, depthTest: false, opacity: 0 });
                notificationMesh = new THREE.Mesh(notificationGeo, notificationMat);
                notificationMesh.renderOrder = 1001;
                notificationMesh.position.set(0, -0.82, -1.18);
                notificationMesh.rotation.x = 0.08;
                camera.add(notificationMesh);
                drawNotification('');

                weaponMat = new THREE.MeshLambertMaterial({
                    color: weaponColors.int,
                    emissive: weaponColors.int,
                    emissiveIntensity: 0.85
                });

                const onControllerConnected = (event) => {
                    const controller = event.target;
                    const handedness = event.data.handedness;
                    controller.userData.isSelecting = false;
                    controller.userData.nextShot = 0;

                    if (handedness === 'right') {
                        rightController = controller;
                        rightWeaponMesh = createGunMesh();
                        rightController.add(rightWeaponMesh);
                        rightController.addEventListener('selectstart', () => {
                            rightController.userData.isSelecting = true;
                            fireWeapon(rightController, rightWeaponMesh);
                        });
                        rightController.addEventListener('selectend', () => rightController.userData.isSelecting = false);
                    } else if (handedness === 'left') {
                        leftController = controller;
                        leftWeaponMesh = createGunMesh();
                        leftController.add(leftWeaponMesh);
                        leftController.addEventListener('selectstart', () => {
                            leftController.userData.isSelecting = true;
                            fireWeapon(leftController, leftWeaponMesh);
                        });
                        leftController.addEventListener('selectend', () => leftController.userData.isSelecting = false);
                    }
                };

                const controller1 = renderer.xr.getController(0);
                controller1.addEventListener('connected', onControllerConnected);
                playerDolly.add(controller1);

                const controller2 = renderer.xr.getController(1);
                controller2.addEventListener('connected', onControllerConnected);
                playerDolly.add(controller2);

                buildBaseEnvironment();
                updateHUD('SISTEMA EN ESPERA');

                window.addEventListener('resize', onWindowResize);
                renderer.setAnimationLoop(animate);
            }

            function buildBaseEnvironment() {
                const gridGeo = new THREE.PlaneGeometry(GRID_SIZE * TILE_SIZE, GRID_SIZE * TILE_SIZE, GRID_SIZE, GRID_SIZE);
                const gridMat = new THREE.MeshBasicMaterial({ color: 0x003300, wireframe: true });
                const floor = new THREE.Mesh(gridGeo, gridMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.set((GRID_SIZE * TILE_SIZE) / 2 - TILE_SIZE / 2, 0, (GRID_SIZE * TILE_SIZE) / 2 - TILE_SIZE / 2);
                scene.add(floor);

                const ceiling = new THREE.Mesh(gridGeo, gridMat);
                ceiling.rotation.x = Math.PI / 2;
                ceiling.position.set((GRID_SIZE * TILE_SIZE) / 2 - TILE_SIZE / 2, TILE_SIZE, (GRID_SIZE * TILE_SIZE) / 2 - TILE_SIZE / 2);
                scene.add(ceiling);
            }

            function startGame() {
                if (gameOverMesh) {
                    camera.remove(gameOverMesh);
                    gameOverMesh = null;
                }

                isGameRunning = true;
                isGameOver = false;
                health = 100;
                score = 0;
                clipAmmo = MAX_CLIP;
                reserveAmmo = 84;
                stamina = MAX_STAMINA;
                isReloading = false;
                rapidFireUntil = 0;
                unlockedWeapons = ['int'];
                currentWeaponIndex = 0;
                missionIndex = 0;
                finalBossSpawned = false;
                finalBossDefeated = false;
                roomStates.clear();
                claimedUpgrades.clear();
                notificationQueue.length = 0;
                activeNotification = null;
                updateWeaponMaterial();

                if (!bgm.isPlaying) {
                    const audioLoader = new THREE.AudioLoader();
                    audioLoader.load('soundtrack.mp3', (buffer) => {
                        bgm.setBuffer(buffer);
                        bgm.setLoop(true);
                        bgm.setVolume(0.35);
                        bgm.play();
                    }, undefined, () => {});
                }

                loadDirectory('/');

                notifyTecGPT('Boss, te encuentras en el home del servidor.');
                notifyTecGPT('Ha sido infectado por el virus Variable Overload. De momento todo parece manejable porque son puras variables de tipo entero. Utiliza tu pistola ARC para eliminarlas.');
                notifyTecGPT(missions[0].intro);
            }

            // --- NOTIFICACIONES Y VOZ ---
            function notifyTecGPT(text, speak = true, duration = null) {
                notificationQueue.push({
                    text,
                    speak,
                    duration: duration || Math.min(12, Math.max(5.5, text.length / 24))
                });
                if (!activeNotification) startNextNotification();
            }

            function startNextNotification() {
                activeNotification = notificationQueue.shift() || null;
                notificationStartTime = clock.getElapsedTime();

                if (!activeNotification) {
                    drawNotification('');
                    if (notificationMesh) notificationMesh.material.opacity = 0;
                    return;
                }

                drawNotification(activeNotification.text);
                if (activeNotification.speak) speakTecGPT(activeNotification.text);
            }

            function speakTecGPT(text) {
                if (!('speechSynthesis' in window)) return;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-MX';
                utterance.rate = 1.04;
                utterance.pitch = 0.96;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }

            function drawNotification(text) {
                notificationCtx.clearRect(0, 0, notificationCanvas.width, notificationCanvas.height);
                if (!text) {
                    notificationTex.needsUpdate = true;
                    return;
                }

                notificationCtx.fillStyle = 'rgba(0, 20, 10, 0.92)';
                roundRect(notificationCtx, 24, 24, 1152, 212, 28, true, false);
                notificationCtx.strokeStyle = '#00ffaa';
                notificationCtx.lineWidth = 8;
                roundRect(notificationCtx, 24, 24, 1152, 212, 28, false, true);

                notificationCtx.fillStyle = '#00ffaa';
                notificationCtx.font = 'bold 34px Courier New';
                notificationCtx.textAlign = 'left';
                notificationCtx.fillText('TecGPT // instrucciones', 58, 70);

                notificationCtx.fillStyle = '#eaffff';
                notificationCtx.font = 'bold 32px Courier New';
                wrapText(notificationCtx, text, 58, 118, 1080, 40);
                notificationTex.needsUpdate = true;
            }

            function updateNotification() {
                if (!notificationMesh || !activeNotification) return;

                const now = clock.getElapsedTime();
                const elapsed = now - notificationStartTime;
                const duration = activeNotification.duration;
                let alpha = 1;
                let y = -0.44;

                if (elapsed < 0.45) {
                    const t = elapsed / 0.45;
                    y = THREE.MathUtils.lerp(-0.82, -0.44, easeOutCubic(t));
                    alpha = t;
                } else if (elapsed > duration - 0.45) {
                    const t = (elapsed - (duration - 0.45)) / 0.45;
                    y = THREE.MathUtils.lerp(-0.44, -0.82, easeOutCubic(t));
                    alpha = 1 - t;
                }

                notificationMesh.position.y = y;
                notificationMesh.material.opacity = THREE.MathUtils.clamp(alpha, 0, 1);

                if (elapsed > duration) startNextNotification();
            }

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
                const words = text.split(' ');
                let line = '';
                for (let i = 0; i < words.length; i++) {
                    const testLine = line + words[i] + ' ';
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && i > 0) {
                        ctx.fillText(line, x, y);
                        line = words[i] + ' ';
                        y += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, x, y);
            }

            function roundRect(ctx, x, y, w, h, r, fill, stroke) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                if (fill) ctx.fill();
                if (stroke) ctx.stroke();
            }

            // --- HUD ---
            function updateHUD(message = '') {
                vrHudCtx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);

                const currentWeapon = unlockedWeapons[currentWeaponIndex] || 'int';
                const colorHex = '#' + weaponColors[currentWeapon].toString(16).padStart(6, '0');

                vrHudCtx.textAlign = 'left';
                vrHudCtx.fillStyle = colorHex;
                vrHudCtx.font = 'bold 40px Courier New';
                vrHudCtx.fillText(`[ ${weaponNames[currentWeapon]} ]`, 24, 44);

                vrHudCtx.fillStyle = '#0ff';
                vrHudCtx.font = 'bold 30px Courier New';
                vrHudCtx.fillText(`AMMO: ${clipAmmo}/${reserveAmmo}`, 24, 88);

                if (clock.getElapsedTime() < rapidFireUntil) {
                    vrHudCtx.fillStyle = '#ffffff';
                    vrHudCtx.fillText('RAPID FIRE', 24, 130);
                }

                vrHudCtx.textAlign = 'center';
                vrHudCtx.fillStyle = '#0f0';
                vrHudCtx.font = 'bold 36px Courier New';
                vrHudCtx.fillText(`HP: ${Math.max(0, Math.floor(health))}%  |  KILLS: ${score}`, 640, 44);

                const barWidth = 360;
                const barX = 640 - (barWidth / 2);
                vrHudCtx.fillStyle = '#004400';
                vrHudCtx.fillRect(barX, 64, barWidth, 16);
                vrHudCtx.fillStyle = stamina > 20 ? '#0f0' : '#ff0000';
                vrHudCtx.fillRect(barX, 64, (stamina / MAX_STAMINA) * barWidth, 16);

                const remaining = getRemainingEnemiesInRoom();
                vrHudCtx.fillStyle = activeWave ? '#ffaa00' : '#00ffaa';
                vrHudCtx.font = 'bold 30px Courier New';
                const roomState = getRoomState(currentPath);
                const lockText = roomState.cleared ? 'PUERTAS ABIERTAS' : 'PUERTAS BLOQUEADAS';
                vrHudCtx.fillText(`ROOM: ${currentPath}  |  ENEMIGOS: ${remaining}  |  ${lockText}`, 640, 120);

                if (message) {
                    vrHudCtx.fillStyle = '#ffaa00';
                    vrHudCtx.font = 'bold 28px Courier New';
                    vrHudCtx.fillText(message, 640, 160);
                }

                drawMinimap();
                vrHudTex.needsUpdate = true;
            }

            function drawMinimap() {
                const mapSize = 190;
                const offsetX = hudCanvas.width - mapSize - 26;
                const offsetY = 16;
                const cellW = mapSize / GRID_SIZE;
                const cellH = mapSize / GRID_SIZE;

                vrHudCtx.fillStyle = 'rgba(0, 10, 0, 0.72)';
                vrHudCtx.fillRect(offsetX, offsetY, mapSize, mapSize);
                vrHudCtx.strokeStyle = '#0f0';
                vrHudCtx.lineWidth = 2;
                vrHudCtx.strokeRect(offsetX, offsetY, mapSize, mapSize);

                for (let z = 0; z < GRID_SIZE; z++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        if (mapGrid[z] && mapGrid[z][x] === 1) {
                            vrHudCtx.fillStyle = '#005500';
                            vrHudCtx.fillRect(offsetX + x * cellW, offsetY + z * cellH, cellW + 1, cellH + 1);
                        } else if (mapGrid[z] && mapGrid[z][x] === 2) {
                            vrHudCtx.fillStyle = '#aaaa00';
                            vrHudCtx.fillRect(offsetX + x * cellW, offsetY + z * cellH, cellW, cellH);
                        }
                    }
                }

                vrHudCtx.fillStyle = '#ffffff';
                vrHudCtx.beginPath();
                vrHudCtx.arc(offsetX + (playerDolly.position.x / TILE_SIZE) * cellW, offsetY + (playerDolly.position.z / TILE_SIZE) * cellH, 4.5, 0, Math.PI * 2);
                vrHudCtx.fill();

                vrHudCtx.fillStyle = '#ff0000';
                enemies.forEach(e => {
                    vrHudCtx.fillRect(offsetX + (e.mesh.position.x / TILE_SIZE) * cellW - 3, offsetY + (e.mesh.position.z / TILE_SIZE) * cellH - 3, 6, 6);
                });

                vrHudCtx.fillStyle = '#00ffff';
                pickups.forEach(p => {
                    vrHudCtx.fillRect(offsetX + (p.mesh.position.x / TILE_SIZE) * cellW - 2, offsetY + (p.mesh.position.z / TILE_SIZE) * cellH - 2, 4, 4);
                });
            }

            function getRemainingEnemiesInRoom() {
                if (!activeWave) return enemies.length;
                return enemies.length + Math.max(0, activeWave.remainingToSpawn);
            }

            // --- MAPA / HABITACIONES ---
            function getRoomState(path) {
                if (!roomStates.has(path)) {
                    roomStates.set(path, { cleared: false, visited: false, started: false });
                }
                return roomStates.get(path);
            }

            function loadDirectory(path) {
                currentPath = path;
                activeWave = null;
                pendingWaveAfterUpgrade = false;

                walls.forEach(w => scene.remove(w.mesh));
                enemies.forEach(e => scene.remove(e.mesh));
                dyingEnemies.forEach(e => scene.remove(e.mesh));
                lasers.forEach(l => scene.remove(l.mesh));
                pickups.forEach(p => scene.remove(p.mesh));
                doors.forEach(d => scene.remove(d.mesh));

                walls = [];
                wallMeshes = [];
                doors = [];
                enemies = [];
                dyingEnemies = [];
                lasers = [];
                pickups = [];
                mapGrid = [];

                generateGrid();
                createDirectoryDoors(path);
                buildWalls();

                const cx = Math.floor(GRID_SIZE / 2);
                const cz = Math.floor(GRID_SIZE / 2);
                playerDolly.position.set(cx * TILE_SIZE, 0, cz * TILE_SIZE);

                const state = getRoomState(path);
                state.visited = true;

                const mission = missions[missionIndex];
                const isObjectiveRoom = mission && path === mission.route;
                const needsUpgrade = isObjectiveRoom && !claimedUpgrades.has(mission.unlock);

                if (!state.cleared && needsUpgrade) {
                    pendingWaveAfterUpgrade = true;
                    spawnWeaponUpgrade(mission.unlock);
                    updateDoorLockStates();
                    updateHUD('RECOGE EL UPGRADE ARC');
                    notifyTecGPT(`Detecto firmas de tipo ${mission.unlock.toUpperCase()} en esta sala. Hay un upgrade ${mission.label} cerca: recógelo antes de aguantar la oleada.`);
                } else if (!state.cleared) {
                    startRoomWave(path);
                } else {
                    updateDoorLockStates();
                    updateHUD(`> cd ${path}`);
                }

                nextRandomSupplyTime = clock.getElapsedTime() + 12;
            }

            function generateGrid() {
                for (let z = 0; z < GRID_SIZE; z++) {
                    const row = [];
                    for (let x = 0; x < GRID_SIZE; x++) {
                        if (z === 0 || z === GRID_SIZE - 1 || x === 0 || x === GRID_SIZE - 1) {
                            row.push(1);
                        } else if (x > 2 && x < GRID_SIZE - 3 && z > 2 && z < GRID_SIZE - 3) {
                            row.push(Math.random() > 0.82 ? 1 : 0);
                        } else {
                            row.push(0);
                        }
                    }
                    mapGrid.push(row);
                }

                const cx = Math.floor(GRID_SIZE / 2);
                const cz = Math.floor(GRID_SIZE / 2);
                for (let dz = -2; dz <= 2; dz++) {
                    for (let dx = -2; dx <= 2; dx++) {
                        mapGrid[cz + dz][cx + dx] = 0;
                    }
                }
            }

            function createDirectoryDoors(path) {
                const cx = Math.floor(GRID_SIZE / 2);
                const cz = Math.floor(GRID_SIZE / 2);
                const parentDir = getParentDir(path);
                const childrenDirs = fsTree[path] || [];

                if (parentDir) {
                    createDoor(cx, GRID_SIZE - 1, parentDir, '..', '#ff3333', true);
                } else {
                    mapGrid[GRID_SIZE - 1][cx] = 1;
                }

                const spots = [
                    { x: cx, z: 0 },
                    { x: 0, z: cz },
                    { x: GRID_SIZE - 1, z: cz },
                    { x: cx - 3, z: 0 },
                    { x: cx + 3, z: GRID_SIZE - 1 }
                ];

                childrenDirs.forEach((child, i) => {
                    if (i >= spots.length) return;
                    const target = path === '/' ? `/${child}` : `${path}/${child}`;
                    createDoor(spots[i].x, spots[i].z, target, child, '#ffff00', false);
                });

                updateDoorLockStates();
            }

            function getParentDir(path) {
                if (path === '/') return null;
                const idx = path.lastIndexOf('/');
                return idx <= 0 ? '/' : path.substring(0, idx);
            }

            function createDoor(gx, gz, targetPath, label, color, isParentDoor = false) {
                mapGrid[gz][gx] = 2;
                if (gz === 0 && mapGrid[gz + 1]) mapGrid[gz + 1][gx] = 0;
                if (gz === GRID_SIZE - 1 && mapGrid[gz - 1]) mapGrid[gz - 1][gx] = 0;
                if (gx === 0 && mapGrid[gz]) mapGrid[gz][gx + 1] = 0;
                if (gx === GRID_SIZE - 1 && mapGrid[gz]) mapGrid[gz][gx - 1] = 0;

                const doorGeo = new THREE.BoxGeometry(TILE_SIZE, TILE_SIZE, TILE_SIZE);
                const mesh = new THREE.Mesh(doorGeo, new THREE.MeshBasicMaterial({ map: makeDoorTexture(label, color, false, false) }));
                mesh.position.set(gx * TILE_SIZE, TILE_SIZE / 2, gz * TILE_SIZE);
                scene.add(mesh);

                doors.push({
                    mesh,
                    label,
                    targetPath,
                    color,
                    isParentDoor,
                    locked: true,
                    routeLocked: false,
                    roomLocked: true,
                    box: new THREE.Box3().setFromObject(mesh)
                });
            }

            function updateDoorLockStates() {
                const roomCleared = getRoomState(currentPath).cleared;
                doors.forEach(door => {
                    door.roomLocked = !roomCleared;
                    door.routeLocked = !door.isParentDoor && !isPathAccessible(door.targetPath);
                    door.locked = door.roomLocked || door.routeLocked;
                    const tex = makeDoorTexture(door.label, door.color, door.locked, door.routeLocked);
                    door.mesh.material.map = tex;
                    door.mesh.material.needsUpdate = true;
                    door.box.setFromObject(door.mesh);
                });
            }

            function makeDoorTexture(label, color, locked, routeLocked) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = locked ? '#220000' : '#002200';
                ctx.fillRect(0, 0, 512, 512);
                ctx.strokeStyle = locked ? '#ff3333' : color;
                ctx.lineWidth = 20;
                ctx.strokeRect(0, 0, 512, 512);
                ctx.fillStyle = locked ? '#ff5555' : color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 54px Courier New';

                if (locked) {
                    ctx.fillText(routeLocked ? 'RUTA' : 'OLEADA', 256, 208);
                    ctx.fillText('BLOQUEADA', 256, 288);
                } else {
                    ctx.fillText('cd', 256, 196);
                    ctx.font = 'bold 48px Courier New';
                    ctx.fillText(label, 256, 292);
                }
                return new THREE.CanvasTexture(canvas);
            }

            function isPathAccessible(path) {
                if (path === '/') return true;
                if (getParentDir(currentPath) === path) return true;

                const accessible = new Set(['/']);
                for (let i = 0; i <= missionIndex && i < missions.length; i++) {
                    addAncestors(accessible, missions[i].route);
                }
                return accessible.has(path);
            }

            function addAncestors(set, path) {
                const parts = path.split('/').filter(Boolean);
                let current = '';
                for (const part of parts) {
                    current += '/' + part;
                    set.add(current);
                }
            }

            function buildWalls() {
                const wallGeo = new THREE.BoxGeometry(TILE_SIZE, TILE_SIZE, TILE_SIZE);
                const wireMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
                const solidMat = new THREE.MeshLambertMaterial({ color: 0x002200 });

                for (let z = 0; z < GRID_SIZE; z++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        if (mapGrid[z][x] === 1) {
                            const mesh = new THREE.Mesh(wallGeo, solidMat);
                            mesh.add(new THREE.Mesh(wallGeo, wireMat));
                            mesh.position.set(x * TILE_SIZE, TILE_SIZE / 2, z * TILE_SIZE);
                            scene.add(mesh);
                            walls.push({ mesh, box: new THREE.Box3().setFromObject(mesh) });
                            wallMeshes.push(mesh);
                        }
                    }
                }
            }

            // --- OLEADAS ---
            function startRoomWave(path) {
                const config = getWaveConfig(path);
                const now = clock.getElapsedTime();
                activeWave = {
                    total: config.total,
                    remainingToSpawn: config.total,
                    dead: 0,
                    config,
                    nextSpawnTime: now + 0.8,
                    spawnRate: config.spawnRate,
                    maxAlive: config.maxAlive
                };
                getRoomState(path).started = true;
                updateDoorLockStates();
                updateHUD('OLEADA INICIADA');
            }

            function getWaveConfig(path) {
                const depth = Math.max(0, path.split('/').filter(Boolean).length);
                const baseDifficulty = 1 + missionIndex * 0.45 + depth * 0.28 + score * 0.015;
                const currentMission = missions[missionIndex];

                if (path === '/') {
                    return {
                        total: 6,
                        types: ['int'],
                        spawnRate: 1.25,
                        maxAlive: 3,
                        difficulty: 1,
                        floatingChance: 0,
                        previewFloat: false
                    };
                }

                if (currentMission && path === currentMission.route) {
                    if (currentMission.unlock === 'auto') {
                        return {
                            total: 22,
                            types: ['int', 'float', 'string', 'bool'],
                            spawnRate: 0.75,
                            maxAlive: 7,
                            difficulty: baseDifficulty + 1.1,
                            floatingChance: 0.35,
                            previewFloat: false,
                            finalHorde: true
                        };
                    }
                    return {
                        total: 10 + missionIndex * 5,
                        types: [currentMission.unlock],
                        spawnRate: Math.max(0.62, 1.0 - missionIndex * 0.1),
                        maxAlive: 4 + missionIndex,
                        difficulty: baseDifficulty + 0.8,
                        floatingChance: currentMission.unlock === 'float' ? 1.0 : 0.2 + missionIndex * 0.08,
                        previewFloat: false,
                        objectiveType: currentMission.unlock
                    };
                }

                if (missionIndex === 0) {
                    return {
                        total: 6 + depth * 2,
                        types: ['int'],
                        spawnRate: 1.05,
                        maxAlive: 3 + Math.min(2, depth),
                        difficulty: baseDifficulty,
                        floatingChance: path.startsWith('/home') ? 0.55 : 0.2,
                        previewFloat: true
                    };
                }

                if (missionIndex === 1) {
                    return {
                        total: 7 + depth * 2,
                        types: ['int', 'float'],
                        spawnRate: 0.95,
                        maxAlive: 4,
                        difficulty: baseDifficulty,
                        floatingChance: 0.42,
                        previewFloat: false
                    };
                }

                if (missionIndex === 2) {
                    return {
                        total: 8 + depth * 2,
                        types: ['int', 'float', 'string'],
                        spawnRate: 0.88,
                        maxAlive: 5,
                        difficulty: baseDifficulty,
                        floatingChance: 0.35,
                        previewFloat: false
                    };
                }

                return {
                    total: 10 + depth * 2,
                    types: ['int', 'float', 'string', 'bool'],
                    spawnRate: 0.80,
                    maxAlive: 6,
                    difficulty: baseDifficulty,
                    floatingChance: 0.38,
                    previewFloat: false
                };
            }

            function updateWaveSpawning() {
                if (!activeWave || !isGameRunning) return;
                const now = clock.getElapsedTime();

                if (activeWave.remainingToSpawn > 0 && enemies.length < activeWave.maxAlive && now >= activeWave.nextSpawnTime) {
                    spawnEnemy(activeWave.config);
                    activeWave.remainingToSpawn--;
                    activeWave.nextSpawnTime = now + activeWave.spawnRate * THREE.MathUtils.randFloat(0.72, 1.24);
                }

                if (activeWave.remainingToSpawn <= 0 && enemies.length === 0) {
                    if (activeWave.config.finalHorde && !finalBossSpawned) {
                        activeWave = null;
                        updateHUD('RAÍZ DEL PROBLEMA DETECTADA');
                        notifyTecGPT('La horda principal cayó, Boss. Ahora apareció el proceso raíz: Variable Overload. Tiene muchas referencias vivas e invocará más variables. Usa auto tipado.');
                        spawnBoss();
                    } else {
                        clearCurrentRoom();
                    }
                }
            }

            function clearCurrentRoom() {
                const state = getRoomState(currentPath);
                if (state.cleared) return;
                state.cleared = true;
                activeWave = null;
                pendingWaveAfterUpgrade = false;
                updateDoorLockStates();
                updateHUD('HABITACIÓN LIMPIA');
                notifyTecGPT(`Directorio ${currentPath} limpio. Las puertas vuelven a estar disponibles.`);

                const mission = missions[missionIndex];
                if (mission && currentPath === mission.route && mission.unlock !== 'auto') {
                    missionIndex++;
                    if (missions[missionIndex]) {
                        notifyTecGPT(missions[missionIndex].intro);
                    }
                }
            }

            function spawnEnemy(config, forcedType = null, forcedPosition = null) {
                const type = forcedType || choose(config.types);
                const floating = Math.random() < (config.floatingChance || 0) || type === 'float';
                const previewFloat = config.previewFloat && floating;
                const actualType = previewFloat ? 'int' : type;
                const label = previewFloat ? choose(['3.14f', '2.71f', 'NaNf']) : choose(typeLabels[actualType] || ['var']);

                const spot = forcedPosition || getRandomSpawnSpot();
                if (!spot) return;

                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                const color = weaponColors[actualType] || 0xff0000;
                const colorCss = '#' + color.toString(16).padStart(6, '0');
                ctx.fillStyle = previewFloat ? '#001a1a' : '#001100';
                ctx.fillRect(0, 0, 256, 256);
                ctx.strokeStyle = colorCss;
                ctx.lineWidth = 10;
                ctx.strokeRect(0, 0, 256, 256);
                ctx.fillStyle = colorCss;
                ctx.font = label.length > 6 ? 'bold 34px Courier New' : 'bold 46px Courier New';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label, 128, 122);
                if (floating) {
                    ctx.font = 'bold 24px Courier New';
                    ctx.fillText('FLOATING', 128, 186);
                }

                const material = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas), color: 0xffffff });
                const size = actualType === 'string' ? 3.6 : 3.1;
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), material);
                const y = floating ? 3.3 + Math.random() * 1.2 : 1.55;
                mesh.position.set(spot.x * TILE_SIZE, y, spot.z * TILE_SIZE);
                scene.add(mesh);

                const hpBase = {
                    int: previewFloat ? 2 : 1,
                    float: 3,
                    string: 4,
                    bool: 2,
                    boss: 90
                }[actualType] || 1;

                enemies.push({
                    mesh,
                    material,
                    type: actualType,
                    label,
                    hp: Math.ceil(hpBase * (config.difficulty || 1)),
                    maxHp: Math.ceil(hpBase * (config.difficulty || 1)),
                    floating,
                    previewFloat,
                    bobOffset: Math.random() * Math.PI * 2,
                    box: new THREE.Box3().setFromObject(mesh),
                    speed: (floating ? 4.7 : 4.0) + Math.min(2.5, score * 0.04) + (config.difficulty || 1) * 0.2,
                    attackCooldown: 0,
                    spawnAddsCooldown: 0,
                    isBoss: false
                });
            }

            function spawnBoss() {
                finalBossSpawned = true;
                const cx = Math.floor(GRID_SIZE / 2);
                const spot = { x: cx, z: 2 };
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#210000';
                ctx.fillRect(0, 0, 512, 512);
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 20;
                ctx.strokeRect(0, 0, 512, 512);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 56px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('VARIABLE', 256, 210);
                ctx.fillText('OVERLOAD', 256, 292);
                ctx.font = 'bold 32px Courier New';
                ctx.fillText('ROOT PROCESS', 256, 366);

                const material = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas), color: 0xffffff });
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(7, 7, 7), material);
                mesh.position.set(spot.x * TILE_SIZE, 4.2, spot.z * TILE_SIZE);
                scene.add(mesh);

                enemies.push({
                    mesh,
                    material,
                    type: 'boss',
                    label: 'Variable Overload',
                    hp: 120,
                    maxHp: 120,
                    floating: true,
                    bobOffset: 0,
                    box: new THREE.Box3().setFromObject(mesh),
                    speed: 2.3,
                    attackCooldown: 0,
                    spawnAddsCooldown: 4,
                    isBoss: true
                });
            }

            function getRandomSpawnSpot() {
                const validSpots = [];
                const px = Math.floor(playerDolly.position.x / TILE_SIZE);
                const pz = Math.floor(playerDolly.position.z / TILE_SIZE);

                for (let z = 1; z < GRID_SIZE - 1; z++) {
                    for (let x = 1; x < GRID_SIZE - 1; x++) {
                        if (mapGrid[z][x] === 0 && Math.abs(x - px) + Math.abs(z - pz) > 6) {
                            validSpots.push({ x, z });
                        }
                    }
                }
                return validSpots.length ? choose(validSpots) : null;
            }

            function choose(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            // --- PICKUPS / DROPS ---
            function spawnWeaponUpgrade(type) {
                const cx = Math.floor(GRID_SIZE / 2);
                const cz = Math.floor(GRID_SIZE / 2) + 2;
                spawnPickup('weapon', new THREE.Vector3(cx * TILE_SIZE, 1.5, cz * TILE_SIZE), type);
            }

            function maybeDropPickup(position) {
                const roll = Math.random();
                if (roll < 0.42) spawnPickup('ammo', position, null);
                else if (roll < 0.62) spawnPickup('health', position, null);
                else if (roll < 0.74) spawnPickup('rapid', position, null);
            }

            function spawnRandomSupply() {
                const spot = getRandomOpenSpotNearCenter();
                if (!spot) return;
                const type = Math.random() < 0.75 ? 'ammo' : (Math.random() < 0.6 ? 'health' : 'rapid');
                spawnPickup(type, new THREE.Vector3(spot.x * TILE_SIZE, 1.1, spot.z * TILE_SIZE), null);
                notifyTecGPT('TecGPT detecta recursos libres en esta habitación. Revisa el minimapa: aparecen como puntos cyan.');
            }

            function getRandomOpenSpotNearCenter() {
                const candidates = [];
                for (let z = 2; z < GRID_SIZE - 2; z++) {
                    for (let x = 2; x < GRID_SIZE - 2; x++) {
                        if (mapGrid[z][x] === 0) candidates.push({ x, z });
                    }
                }
                return candidates.length ? choose(candidates) : null;
            }

            function spawnPickup(kind, position, payload) {
                const group = new THREE.Group();
                const color = kind === 'ammo' ? 0x00ffff : kind === 'health' ? 0xff3333 : kind === 'rapid' ? 0xffffff : weaponColors[payload];
                const mat = new THREE.MeshLambertMaterial({ color, emissive: color, emissiveIntensity: 0.6 });
                const mesh = kind === 'weapon'
                    ? new THREE.Mesh(new THREE.OctahedronGeometry(1.4, 0), mat)
                    : new THREE.Mesh(new THREE.IcosahedronGeometry(1.0, 0), mat);
                group.add(mesh);

                const labelText = kind === 'weapon' ? weaponNames[payload] : kind.toUpperCase();
                const label = createFloatingLabel(labelText, color);
                label.position.set(0, 1.8, 0);
                group.add(label);

                group.position.copy(position);
                scene.add(group);
                pickups.push({ mesh: group, core: mesh, label, kind, payload, box: new THREE.Box3().setFromObject(group) });
            }

            function createFloatingLabel(text, color) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, 512, 128);
                ctx.strokeStyle = '#' + color.toString(16).padStart(6, '0');
                ctx.lineWidth = 6;
                ctx.strokeRect(4, 4, 504, 120);
                ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
                ctx.font = 'bold 42px Courier New';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 256, 66);

                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthTest: false });
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 1.1), material);
                plane.renderOrder = 998;
                return plane;
            }

            function updatePickups(delta) {
                for (let i = pickups.length - 1; i >= 0; i--) {
                    const p = pickups[i];
                    p.mesh.rotation.y += delta * 1.8;
                    p.core.rotation.x += delta * 2.2;
                    p.label.lookAt(camera.getWorldPosition(new THREE.Vector3()));
                    p.box.setFromObject(p.mesh);

                    if (p.mesh.position.distanceTo(playerDolly.position) < 3.0) {
                        collectPickup(p);
                        scene.remove(p.mesh);
                        pickups.splice(i, 1);
                    }
                }

                const now = clock.getElapsedTime();
                if (activeWave && now > nextRandomSupplyTime && pickups.filter(p => p.kind !== 'weapon').length < 3) {
                    spawnRandomSupply();
                    nextRandomSupplyTime = now + THREE.MathUtils.randFloat(18, 28);
                }
            }

            function collectPickup(pickup) {
                if (pickup.kind === 'ammo') {
                    reserveAmmo = Math.min(MAX_RESERVE, reserveAmmo + 24);
                    updateHUD('+24 BALAS');
                } else if (pickup.kind === 'health') {
                    health = Math.min(100, health + 24);
                    updateHUD('+24 HP');
                } else if (pickup.kind === 'rapid') {
                    rapidFireUntil = Math.max(rapidFireUntil, clock.getElapsedTime() + 12);
                    updateHUD('RAPID FIRE x12s');
                } else if (pickup.kind === 'weapon') {
                    const type = pickup.payload;
                    if (!unlockedWeapons.includes(type)) unlockedWeapons.push(type);
                    claimedUpgrades.add(type);
                    currentWeaponIndex = unlockedWeapons.indexOf(type);
                    updateWeaponMaterial();
                    updateHUD(`${weaponNames[type]} DESBLOQUEADA`);

                    const mission = missions.find(m => m.unlock === type);
                    notifyTecGPT(mission ? mission.onUpgrade : `${weaponNames[type]} desbloqueada.`);

                    if (pendingWaveAfterUpgrade && missions[missionIndex] && missions[missionIndex].unlock === type) {
                        pendingWaveAfterUpgrade = false;
                        startRoomWave(currentPath);
                    }
                }
            }

            // --- ARMAS ---
            function createGunMesh() {
                const mesh = new THREE.Group();
                const gunDarkMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

                const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.3), gunDarkMat);
                const core = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.03, 0.15), weaponMat);
                core.position.set(0, 0.06, -0.05);
                mesh.add(body);
                mesh.add(core);

                const laserGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0.06, 0),
                    new THREE.Vector3(0, 0.06, -50)
                ]);
                const laserMat = new THREE.LineBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
                const aimLine = new THREE.Line(laserGeo, laserMat);
                aimLine.name = 'aimLine';
                mesh.add(aimLine);

                mesh.position.set(0, -0.05, -0.1);
                mesh.rotation.x = -Math.PI / 8;
                return mesh;
            }

            function getCurrentWeaponType() {
                return unlockedWeapons[currentWeaponIndex] || 'int';
            }

            function updateWeaponMaterial() {
                const type = getCurrentWeaponType();
                const hex = weaponColors[type] || weaponColors.int;
                if (weaponMat) {
                    weaponMat.color.setHex(hex);
                    weaponMat.emissive.setHex(hex);
                }
                [leftWeaponMesh, rightWeaponMesh].forEach(mesh => {
                    if (!mesh) return;
                    const aimLine = mesh.getObjectByName('aimLine');
                    if (aimLine) aimLine.material.color.setHex(hex);
                });
            }

            function switchWeapon() {
                if (unlockedWeapons.length <= 1) {
                    updateHUD('SOLO ARC-INT DISPONIBLE');
                    return;
                }
                currentWeaponIndex = (currentWeaponIndex + 1) % unlockedWeapons.length;
                updateWeaponMaterial();
                updateHUD(`MODO: ${weaponNames[getCurrentWeaponType()]}`);
            }

            function fireWeapon(ctrl, wpnMesh) {
                if (!ctrl || !wpnMesh) return;

                const now = clock.getElapsedTime();
                const fireDelay = now < rapidFireUntil ? 0.11 : 0.28;
                if (ctrl.userData.nextShot && now < ctrl.userData.nextShot) return;
                ctrl.userData.nextShot = now + fireDelay;

                const matrix = new THREE.Matrix4().extractRotation(wpnMesh.matrixWorld);
                const direction = new THREE.Vector3(0, 0, -1).applyMatrix4(matrix).normalize();
                const startPos = new THREE.Vector3();
                wpnMesh.getWorldPosition(startPos);

                if (isGameOver && gameOverMesh) {
                    shootRestartRay(startPos, direction);
                    return;
                }

                if (!isGameRunning || isReloading) return;

                if (clipAmmo <= 0) {
                    reloadWeapon();
                    return;
                }

                clipAmmo--;
                updateHUD();
                playShootSound();

                const type = getCurrentWeaponType();
                const laser = new THREE.Mesh(
                    new THREE.CylinderGeometry(type === 'auto' ? 0.075 : 0.05, type === 'auto' ? 0.075 : 0.05, 1.6, 8).rotateX(Math.PI / 2),
                    new THREE.MeshBasicMaterial({ color: weaponColors[type] || 0x00ff00 })
                );
                laser.position.copy(startPos);
                laser.lookAt(startPos.clone().add(direction));
                scene.add(laser);

                lasers.push({ mesh: laser, dir: direction, speed: 78, type, box: new THREE.Box3() });
            }

            function reloadWeapon() {
                if (reserveAmmo <= 0) {
                    updateHUD('SIN MUNICIÓN');
                    return;
                }
                isReloading = true;
                updateHUD('> RECARGANDO...');
                setTimeout(() => {
                    const needed = MAX_CLIP - clipAmmo;
                    const amount = Math.min(needed, reserveAmmo);
                    clipAmmo += amount;
                    reserveAmmo -= amount;
                    isReloading = false;
                    updateHUD();
                }, 1050);
            }

            function shootRestartRay(startPos, direction) {
                const tempLaser = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.02, 0.02, 5, 8).rotateX(Math.PI / 2),
                    new THREE.MeshBasicMaterial({ color: 0xff0000 })
                );
                tempLaser.position.copy(startPos);
                tempLaser.lookAt(startPos.clone().add(direction));
                scene.add(tempLaser);
                setTimeout(() => scene.remove(tempLaser), 150);
                playShootSound();

                const ray = new THREE.Raycaster(startPos, direction);
                const hits = ray.intersectObject(gameOverMesh);
                if (hits.length > 0) startGame();
            }

            function updateLasers(delta) {
                for (let i = lasers.length - 1; i >= 0; i--) {
                    const l = lasers[i];
                    l.mesh.position.addScaledVector(l.dir, l.speed * delta);
                    l.box.setFromObject(l.mesh);

                    let hit = walls.some(w => l.box.intersectsBox(w.box));

                    if (!hit) {
                        for (let j = enemies.length - 1; j >= 0; j--) {
                            const e = enemies[j];
                            if (l.box.intersectsBox(e.box)) {
                                hit = true;
                                damageEnemy(e, j, l.type);
                                break;
                            }
                        }
                    }

                    if (hit || l.mesh.position.distanceTo(playerDolly.position) > 120) {
                        scene.remove(l.mesh);
                        lasers.splice(i, 1);
                    }
                }
            }

            function canDamageEnemy(weaponType, enemy) {
                if (weaponType === 'auto') return true;
                if (enemy.isBoss) return weaponType === 'auto';
                return weaponType === enemy.type;
            }

            function getDamage(weaponType, enemy) {
                if (enemy.isBoss) return weaponType === 'auto' ? 6 : 0;
                if (weaponType === 'auto') return 4;
                return 1;
            }

            function damageEnemy(enemy, enemyIndex, weaponType) {
                if (!canDamageEnemy(weaponType, enemy)) {
                    updateHUD('ERROR DE TIPO');
                    playErrorSound();
                    return;
                }

                enemy.hp -= getDamage(weaponType, enemy);
                enemy.material.color.setHex(0xff5555);
                setTimeout(() => enemy.material && enemy.material.color.setHex(0xffffff), 90);

                if (enemy.hp <= 0) killEnemy(enemy, enemyIndex);
                else if (enemy.isBoss) updateHUD(`BOSS HP: ${Math.ceil(enemy.hp)}/${enemy.maxHp}`);
            }

            function killEnemy(enemy, enemyIndex) {
                enemy.deathTimer = 1.0;
                enemy.material.color.setHex(0xff0000);
                dyingEnemies.push(enemy);
                enemies.splice(enemyIndex, 1);
                score++;

                if (activeWave) activeWave.dead++;
                if (!enemy.isBoss) maybeDropPickup(enemy.mesh.position.clone());

                if (enemy.isBoss) {
                    finalBossDefeated = true;
                    finishGame();
                }

                updateHUD();
            }

            function updateDyingEnemies(delta) {
                for (let i = dyingEnemies.length - 1; i >= 0; i--) {
                    const e = dyingEnemies[i];
                    e.deathTimer -= delta * 2;
                    e.mesh.rotation.y += 15 * delta;
                    e.mesh.rotation.x += 10 * delta;
                    e.mesh.scale.setScalar(Math.max(0.01, e.deathTimer));
                    if (e.deathTimer <= 0) {
                        scene.remove(e.mesh);
                        dyingEnemies.splice(i, 1);
                    }
                }
            }

            // --- ENEMIGOS / IA ---
            function updateFlowField(targetX, targetZ) {
                for (let z = 0; z < GRID_SIZE; z++) {
                    for (let x = 0; x < GRID_SIZE; x++) flowField[z][x] = 9999;
                }
                if (targetX < 0 || targetX >= GRID_SIZE || targetZ < 0 || targetZ >= GRID_SIZE) return;

                const queue = [{ x: targetX, z: targetZ, dist: 0 }];
                flowField[targetZ][targetX] = 0;
                const dirs = [{ x: 0, z: -1 }, { x: 0, z: 1 }, { x: -1, z: 0 }, { x: 1, z: 0 }];

                while (queue.length > 0) {
                    const curr = queue.shift();
                    for (const d of dirs) {
                        const nx = curr.x + d.x;
                        const nz = curr.z + d.z;
                        if (nx >= 0 && nx < GRID_SIZE && nz >= 0 && nz < GRID_SIZE && mapGrid[nz][nx] !== 1) {
                            if (flowField[nz][nx] > curr.dist + 1) {
                                flowField[nz][nx] = curr.dist + 1;
                                queue.push({ x: nx, z: nz, dist: curr.dist + 1 });
                            }
                        }
                    }
                }
            }

            function updateEnemies(delta, time) {
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    e.attackCooldown = Math.max(0, e.attackCooldown - delta);

                    if (e.floating) {
                        const targetY = e.isBoss ? 4.2 : 3.2;
                        e.mesh.position.y = targetY + Math.sin(time * 2.2 + e.bobOffset) * (e.isBoss ? 0.45 : 0.65);
                    }

                    e.mesh.lookAt(playerDolly.position.x, e.mesh.position.y, playerDolly.position.z);

                    if (e.isBoss) {
                        e.spawnAddsCooldown -= delta;
                        if (e.spawnAddsCooldown <= 0 && enemies.length < 10) {
                            for (let n = 0; n < 2; n++) {
                                spawnEnemy({ types: ['int', 'float', 'string', 'bool'], difficulty: 1.7, floatingChance: 0.35 }, choose(['int', 'float', 'string', 'bool']));
                            }
                            e.spawnAddsCooldown = THREE.MathUtils.randFloat(4.5, 7.0);
                            notifyTecGPT('El jefe invocó más variables. Mantén auto tipado activo y controla la horda.');
                        }
                    }

                    const dirToPlayer = new THREE.Vector3().subVectors(playerDolly.position, e.mesh.position);
                    const distToPlayer = dirToPlayer.length();
                    let dir = new THREE.Vector3();
                    let hasLOS = false;

                    if (distToPlayer < 35) {
                        const ray = new THREE.Raycaster(e.mesh.position, dirToPlayer.clone().normalize(), 0, distToPlayer);
                        const hits = ray.intersectObjects(wallMeshes);
                        if (hits.length === 0) hasLOS = true;
                    }

                    if (hasLOS) {
                        dir.copy(dirToPlayer);
                    } else {
                        const ex = Math.floor(e.mesh.position.x / TILE_SIZE);
                        const ez = Math.floor(e.mesh.position.z / TILE_SIZE);
                        let bestDist = (flowField[ez] && flowField[ez][ex] !== undefined) ? flowField[ez][ex] : 9999;
                        let bestX = ex;
                        let bestZ = ez;
                        const dirs = [{ x: 0, z: -1 }, { x: 0, z: 1 }, { x: -1, z: 0 }, { x: 1, z: 0 }];

                        for (const d of dirs) {
                            const nx = ex + d.x;
                            const nz = ez + d.z;
                            if (nx >= 0 && nx < GRID_SIZE && nz >= 0 && nz < GRID_SIZE && mapGrid[nz][nx] !== 1) {
                                if (flowField[nz][nx] < bestDist) {
                                    bestDist = flowField[nz][nx];
                                    bestX = nx;
                                    bestZ = nz;
                                }
                            }
                        }

                        const targetPos = new THREE.Vector3(bestX * TILE_SIZE, e.mesh.position.y, bestZ * TILE_SIZE);
                        dir.subVectors(targetPos, e.mesh.position);
                        if (dir.length() < 1.0) dir.copy(dirToPlayer);
                    }

                    dir.y = 0;
                    if (dir.length() > 0) dir.normalize();

                    const prevX = e.mesh.position.x;
                    const prevZ = e.mesh.position.z;

                    e.mesh.position.x += dir.x * e.speed * delta;
                    e.box.setFromObject(e.mesh);
                    if (!e.floating && walls.some(w => e.box.intersectsBox(w.box))) e.mesh.position.x = prevX;

                    e.mesh.position.z += dir.z * e.speed * delta;
                    e.box.setFromObject(e.mesh);
                    if (!e.floating && walls.some(w => e.box.intersectsBox(w.box))) e.mesh.position.z = prevZ;

                    if (distToPlayer < (e.isBoss ? 6.0 : 3.6) && e.attackCooldown <= 0 && isGameRunning) {
                        const damage = e.isBoss ? 24 : 10 + missionIndex * 2;
                        health -= damage;
                        e.attackCooldown = e.isBoss ? 1.2 : 0.8;

                        if (health <= 0) {
                            showEndScreen('KERNEL PANIC', `SCORE FINAL: ${score}`, '#ff0000');
                        } else {
                            updateHUD('¡SISTEMA DAÑADO!');
                        }

                        e.mesh.position.addScaledVector(dir, -4.5);
                    }
                }
            }

            // --- MOVIMIENTO / PUERTAS ---
            function updatePlayerMovement(delta) {
                const session = renderer.xr.getSession();
                if (!session) return;

                if (weaponSwitchCooldown > 0) weaponSwitchCooldown -= delta;
                if (doorWarningCooldown > 0) doorWarningCooldown -= delta;

                for (const source of session.inputSources) {
                    if (!source.gamepad) continue;

                    let axX = 0;
                    let axY = 0;
                    if (source.gamepad.axes.length >= 4) {
                        axX = source.gamepad.axes[2];
                        axY = source.gamepad.axes[3];
                    } else if (source.gamepad.axes.length >= 2) {
                        axX = source.gamepad.axes[0];
                        axY = source.gamepad.axes[1];
                    }
                    if (Math.abs(axX) < 0.2) axX = 0;
                    if (Math.abs(axY) < 0.2) axY = 0;

                    if (source.handedness === 'left') {
                        let isSprinting = false;
                        if (source.gamepad.buttons[1] && source.gamepad.buttons[1].pressed && stamina > 0) {
                            isSprinting = true;
                            stamina = Math.max(0, stamina - 35 * delta);
                        } else {
                            stamina = Math.min(MAX_STAMINA, stamina + 20 * delta);
                        }

                        if (axX !== 0 || axY !== 0) {
                            const moveSpeed = (isSprinting && stamina > 0 ? 11 : 6) * delta;
                            const fwDir = new THREE.Vector3();
                            camera.getWorldDirection(fwDir);
                            fwDir.y = 0;
                            fwDir.normalize();
                            const rtDir = new THREE.Vector3().copy(fwDir).cross(camera.up).normalize();

                            const moveVec = new THREE.Vector3();
                            moveVec.addScaledVector(fwDir, -axY * moveSpeed);
                            moveVec.addScaledVector(rtDir, axX * moveSpeed);

                            const px = playerDolly.position.x + moveVec.x;
                            const pz = playerDolly.position.z + moveVec.z;
                            const pBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(px, 1, pz), new THREE.Vector3(2, 2, 2));
                            if (!hitsWorldCollision(pBox)) {
                                playerDolly.position.x = px;
                                playerDolly.position.z = pz;
                            }
                        }
                    }

                    if (source.handedness === 'right') {
                        if (axX !== 0) playerDolly.rotation.y -= axX * 2.5 * delta;

                        const aPressed = source.gamepad.buttons[4] && source.gamepad.buttons[4].pressed;
                        const bPressed = source.gamepad.buttons[5] && source.gamepad.buttons[5].pressed;
                        const thumbPressed = source.gamepad.buttons[3] && source.gamepad.buttons[3].pressed;
                        if ((aPressed || bPressed || thumbPressed) && weaponSwitchCooldown <= 0) {
                            switchWeapon();
                            weaponSwitchCooldown = 0.5;
                        }
                    }
                }
            }

            function hitsWorldCollision(box) {
                if (walls.some(w => box.intersectsBox(w.box))) return true;
                if (doors.some(d => d.locked && box.intersectsBox(d.box))) return true;
                return false;
            }

            function updateDoorTransitions() {
                for (const d of doors) {
                    const dist = playerDolly.position.distanceTo(d.mesh.position);
                    if (dist < TILE_SIZE / 1.55) {
                        if (d.locked) {
                            if (doorWarningCooldown <= 0) {
                                if (d.routeLocked) notifyTecGPT('Ruta no autorizada todavía. Sigue la ruta sugerida por TecGPT para no romper la campaña.');
                                else notifyTecGPT('Puerta bloqueada. Limpia la oleada de esta habitación para desbloquear el directorio.');
                                updateHUD(d.routeLocked ? 'RUTA BLOQUEADA' : 'OLEADA ACTIVA');
                                doorWarningCooldown = 4.0;
                            }
                        } else {
                            loadDirectory(d.targetPath);
                            break;
                        }
                    }
                }
            }

            // --- AUDIO ---
            function ensureAudioContext() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playShootSound() {
                ensureAudioContext();
                const t = audioCtx.currentTime;
                const bufferSize = audioCtx.sampleRate * 0.15;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.value = 3600;
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.75, t);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);

                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(170, t);
                osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.1);
                const oscGain = audioCtx.createGain();
                oscGain.gain.setValueAtTime(0.75, t);
                oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.connect(oscGain);
                oscGain.connect(audioCtx.destination);

                noise.start(t);
                osc.start(t);
            }

            function playErrorSound() {
                ensureAudioContext();
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(90, t);
                osc.frequency.setValueAtTime(55, t + 0.08);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.2);
            }

            // --- PANTALLAS FINALES ---
            function showEndScreen(title, subtitle, color) {
                isGameOver = true;
                isGameRunning = false;
                activeWave = null;

                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = color === '#00ffaa' ? 'rgba(0, 30, 20, 0.95)' : 'rgba(40, 0, 0, 0.95)';
                ctx.fillRect(0, 0, 1024, 1024);
                ctx.strokeStyle = color;
                ctx.lineWidth = 15;
                ctx.strokeRect(0, 0, 1024, 1024);
                ctx.textAlign = 'center';
                ctx.fillStyle = color;
                ctx.font = 'bold 104px Courier New';
                ctx.fillText(title, 512, 280);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 62px Courier New';
                ctx.fillText(subtitle, 512, 485);
                ctx.fillStyle = '#0f0';
                ctx.font = 'bold 54px Courier New';
                ctx.fillText('[ DISPARA AQUÍ ]', 512, 740);
                ctx.fillText('PARA REINICIAR', 512, 830);

                const tex = new THREE.CanvasTexture(canvas);
                const geo = new THREE.PlaneGeometry(1.5, 1.5);
                const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false });
                gameOverMesh = new THREE.Mesh(geo, mat);
                gameOverMesh.renderOrder = 1002;
                gameOverMesh.position.set(0, 0, -1.5);
                camera.add(gameOverMesh);
            }

            function finishGame() {
                notifyTecGPT('Root cause eliminado. Variable Overload ha sido purgado del servidor. Buen trabajo, Boss.');
                showEndScreen('SERVER CLEAN', `SCORE FINAL: ${score}`, '#00ffaa');
            }

            // --- LOOP ---
            function animate() {
                const delta = clock.getDelta();
                const time = clock.getElapsedTime();

                updateNotification();

                if (!isGameRunning) {
                    renderer.render(scene, camera);
                    return;
                }

                updatePlayerMovement(delta);

                if (rightController && rightController.userData.isSelecting) fireWeapon(rightController, rightWeaponMesh);
                if (leftController && leftController.userData.isSelecting) fireWeapon(leftController, leftWeaponMesh);

                updateDoorTransitions();
                updateWaveSpawning();
                updateLasers(delta);
                updateDyingEnemies(delta);
                updatePickups(delta);

                if (time - lastFlowFieldUpdate > 0.28) {
                    const px = Math.floor(playerDolly.position.x / TILE_SIZE);
                    const pz = Math.floor(playerDolly.position.z / TILE_SIZE);
                    updateFlowField(px, pz);
                    lastFlowFieldUpdate = time;
                }

                updateEnemies(delta, time);

                if (time - lastHudUpdate > 0.12) {
                    updateHUD();
                    lastHudUpdate = time;
                }

                renderer.render(scene, camera);
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        } catch (error) {
            document.getElementById('error-log').innerText = '❌ Falla de ejecución: ' + error.message;
            console.error(error);
        }
    </script>
</body>
