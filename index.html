<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UNIX DOOM VR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #info {
            text-align: center;
            z-index: 10;
        }
        h1 { 
            font-size: 80px; 
            margin: 0; 
            text-shadow: 0 0 15px #0f0;
            letter-spacing: 5px;
        }
        p { color: #55ff55; font-size: 18px; }
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #error-log { color: #ff0000; font-weight: bold; margin-top: 20px; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">
        <h1>START</h1>
        <p>↓ Pulsa ENTER VR abajo ↓</p>
        <p><b>Mando Izq:</b> Joystick (Mover) | Botón Lateral/Grip (Correr) | Gatillo (Disparar Izq)</p>
        <p><b>Mando Der:</b> Joystick (Girar) | Botones A/B (Cambiar Arma) | Gatillo (Disparar Der)</p>
        <div id="error-log"></div>
    </div>

    <div id="game-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        try {
            // --- VARIABLES GLOBALES ---
            const fsTree = {
                "/": ["bin", "etc", "home", "var"],
                "/bin": ["bash", "ls"], "/etc": ["ssh", "config"],
                "/home": ["hacker"], "/home/hacker": ["scripts", "payloads"],
                "/var": ["log"]
            };

            let camera, scene, renderer;
            let playerDolly;
            let rightController = null;
            let leftController = null;
            
            let health = 100;
            let score = 0;
            let isGameOver = false;
            let isGameRunning = false;

            let stamina = 100;
            const MAX_STAMINA = 100;
            
            let clipAmmo = 60; // Aumenté el cargador base por tener dos pistolas
            const MAX_CLIP = 60;
            let reserveAmmo = 120;
            let isReloading = false;

            let currentPath = "/";
            const weaponTypes = ['int', 'float', 'string', 'bool'];
            let currentWeaponIndex = 0;
            let weaponSwitchCooldown = 0;
            
            const weaponColors = {
                'int': 0x00ff00, 'float': 0x00ffff, 
                'string': 0xffff00, 'bool': 0xaa00ff
            };

            let mapGrid = [];
            const TILE_SIZE = 10;
            const GRID_SIZE = 15;
            let walls = [], wallMeshes = [], doors = [], enemies = [], dyingEnemies = [], lasers = [];
            let spawnInterval;

            let flowField = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(9999));
            let lastFlowFieldUpdate = 0;
            let lastHudUpdate = 0;

            const clock = new THREE.Clock();

            // HUD
            const hudCanvas = document.createElement('canvas');
            hudCanvas.width = 1024; hudCanvas.height = 256;
            const vrHudCtx = hudCanvas.getContext('2d');
            const vrHudTex = new THREE.CanvasTexture(hudCanvas);
            let vrHudMesh, rightWeaponMesh, leftWeaponMesh, weaponMat, gameOverMesh;

            let audioCtx;
            let listener;
            let bgm;

            init();

            function init() {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x000a00);
                scene.fog = new THREE.FogExp2(0x001100, 0.015);

                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 1.6, 0);

                const ambientLight = new THREE.AmbientLight(0x00aa00, 1.2); 
                scene.add(ambientLight);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.xr.enabled = true;
                document.getElementById('game-container').appendChild(renderer.domElement);
                
                const vrButton = VRButton.createButton(renderer);
                vrButton.addEventListener('click', () => {
                    document.getElementById('info').style.display = 'none';
                    if(!isGameRunning) startGame();
                });
                document.body.appendChild(vrButton);

                playerDolly = new THREE.Group();
                scene.add(playerDolly);
                playerDolly.add(camera);

                const pointLight = new THREE.PointLight(0x00ff00, 1.5, 40);
                pointLight.position.set(0, 2, 0);
                playerDolly.add(pointLight);

                listener = new THREE.AudioListener();
                camera.add(listener);
                bgm = new THREE.Audio(listener);

                // --- HUD VISOR (BAJADO) ---
                const hudGeo = new THREE.PlaneGeometry(1.6, 0.4); 
                const hudMat = new THREE.MeshBasicMaterial({ 
                    map: vrHudTex, 
                    transparent: true, 
                    depthTest: false 
                });
                vrHudMesh = new THREE.Mesh(hudGeo, hudMat);
                vrHudMesh.renderOrder = 999;
                
                // Bajamos el HUD (antes 0.5, ahora 0.15) para que no tape el centro visual
                vrHudMesh.position.set(0, 0.15, -1.2);
                vrHudMesh.rotation.x = -0.05; // Leve inclinación
                camera.add(vrHudMesh);

                // CREAR MATERIAL COMPARTIDO PARA LAS DOS PISTOLAS
                weaponMat = new THREE.MeshLambertMaterial({ 
                    color: weaponColors['int'], 
                    emissive: weaponColors['int'], 
                    emissiveIntensity: 0.8 
                });

                // MANDOS
                const onControllerConnected = (event) => {
                    const controller = event.target;
                    const handedness = event.data.handedness;

                    if (handedness === 'right') {
                        rightController = controller;
                        rightWeaponMesh = createGunMesh();
                        rightController.add(rightWeaponMesh);
                        rightController.addEventListener('selectstart', () => fireWeapon(rightController, rightWeaponMesh)); 
                    } else if (handedness === 'left') {
                        leftController = controller;
                        leftWeaponMesh = createGunMesh();
                        leftController.add(leftWeaponMesh);
                        leftController.addEventListener('selectstart', () => fireWeapon(leftController, leftWeaponMesh));
                    }
                };

                const controller1 = renderer.xr.getController(0);
                controller1.addEventListener('connected', onControllerConnected);
                playerDolly.add(controller1);

                const controller2 = renderer.xr.getController(1);
                controller2.addEventListener('connected', onControllerConnected);
                playerDolly.add(controller2);

                buildEnvironment();
                updateHUD("SISTEMA INICIADO");

                window.addEventListener('resize', onWindowResize);
                renderer.setAnimationLoop(animate);
            }

            function playShootSound() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const t = audioCtx.currentTime;

                const bufferSize = audioCtx.sampleRate * 0.2; 
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.value = 3500;
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(1, t);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(audioCtx.destination);

                const osc = audioCtx.createOscillator(); osc.type = 'sine';
                osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.1);
                const oscGain = audioCtx.createGain(); oscGain.gain.setValueAtTime(1, t); oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.connect(oscGain); oscGain.connect(audioCtx.destination);

                noise.start(t); osc.start(t);
            }

            // FUNCIÓN REUTILIZABLE PARA CREAR ARMAS
            function createGunMesh() {
                const mesh = new THREE.Group();
                const gunDarkMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
                
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.3), gunDarkMat);
                const core = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.03, 0.15), weaponMat);
                core.position.set(0, 0.06, -0.05);
                mesh.add(body); mesh.add(core);

                const laserGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0.06, 0), new THREE.Vector3(0, 0.06, -50)
                ]);
                const laserMat = new THREE.LineBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
                const aimLine = new THREE.Line(laserGeo, laserMat);
                mesh.add(aimLine); 
                
                mesh.position.set(0, -0.05, -0.1);
                mesh.rotation.x = -Math.PI / 8;
                return mesh;
            }

            function buildEnvironment() {
                const gridGeo = new THREE.PlaneGeometry(GRID_SIZE * TILE_SIZE, GRID_SIZE * TILE_SIZE, GRID_SIZE, GRID_SIZE);
                const gridMat = new THREE.MeshBasicMaterial({ color: 0x003300, wireframe: true });
                const floor = new THREE.Mesh(gridGeo, gridMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.set((GRID_SIZE * TILE_SIZE)/2 - TILE_SIZE/2, 0, (GRID_SIZE * TILE_SIZE)/2 - TILE_SIZE/2);
                scene.add(floor);
                const ceiling = new THREE.Mesh(gridGeo, gridMat);
                ceiling.rotation.x = Math.PI / 2;
                ceiling.position.set((GRID_SIZE * TILE_SIZE)/2 - TILE_SIZE/2, TILE_SIZE, (GRID_SIZE * TILE_SIZE)/2 - TILE_SIZE/2);
                scene.add(ceiling);
            }

            function updateHUD(message = "") {
                vrHudCtx.clearRect(0, 0, 1024, 256);

                // --- 1. SUPERIOR IZQUIERDA: Arma y Munición ---
                vrHudCtx.textAlign = 'left';
                vrHudCtx.fillStyle = '#' + weaponColors[weaponTypes[currentWeaponIndex]].toString(16).padStart(6,'0');
                vrHudCtx.font = 'bold 36px Courier New';
                vrHudCtx.fillText(`[ ${weaponTypes[currentWeaponIndex].toUpperCase()} ]`, 20, 40);
                
                vrHudCtx.fillStyle = '#0ff';
                vrHudCtx.font = 'bold 28px Courier New';
                vrHudCtx.fillText(`AMMO: ${clipAmmo}/${reserveAmmo}`, 20, 80);

                // --- 2. SUPERIOR CENTRO: Salud y Stamina ---
                vrHudCtx.textAlign = 'center';
                vrHudCtx.fillStyle = '#0f0';
                vrHudCtx.font = 'bold 34px Courier New';
                vrHudCtx.fillText(`HP: ${health}%  |  KILLS: ${score}`, 512, 40);

                // Barra de Stamina Centrada
                const barWidth = 350;
                const barX = 512 - (barWidth / 2);
                vrHudCtx.fillStyle = '#004400';
                vrHudCtx.fillRect(barX, 60, barWidth, 15);
                vrHudCtx.fillStyle = stamina > 20 ? '#0f0' : '#ff0000';
                vrHudCtx.fillRect(barX, 60, (stamina / MAX_STAMINA) * barWidth, 15);

                if(message) {
                    vrHudCtx.fillStyle = '#ffaa00';
                    vrHudCtx.font = 'bold 26px Courier New';
                    vrHudCtx.fillText(message, 512, 110);
                }

                // --- 3. SUPERIOR DERECHA: Minimapa ---
                const mapSize = 160;
                const offsetX = 1024 - mapSize - 20;
                const offsetY = 10;
                const cellW = mapSize / GRID_SIZE;
                const cellH = mapSize / GRID_SIZE;

                vrHudCtx.fillStyle = 'rgba(0, 10, 0, 0.7)';
                vrHudCtx.fillRect(offsetX, offsetY, mapSize, mapSize);
                vrHudCtx.strokeStyle = '#0f0';
                vrHudCtx.lineWidth = 2;
                vrHudCtx.strokeRect(offsetX, offsetY, mapSize, mapSize);

                for(let z=0; z<GRID_SIZE; z++){
                    for(let x=0; x<GRID_SIZE; x++){
                        if(mapGrid[z] && mapGrid[z][x] === 1){
                            vrHudCtx.fillStyle = '#005500';
                            vrHudCtx.fillRect(offsetX + x*cellW, offsetY + z*cellH, cellW+1, cellH+1); 
                        } else if (mapGrid[z] && mapGrid[z][x] === 2) {
                            vrHudCtx.fillStyle = '#aaaa00';
                            vrHudCtx.fillRect(offsetX + x*cellW, offsetY + z*cellH, cellW, cellH);
                        }
                    }
                }

                // Jugador
                let px = (playerDolly.position.x / TILE_SIZE) * cellW;
                let pz = (playerDolly.position.z / TILE_SIZE) * cellH;
                vrHudCtx.fillStyle = '#ffffff';
                vrHudCtx.beginPath();
                vrHudCtx.arc(offsetX + px, offsetY + pz, 4, 0, Math.PI*2);
                vrHudCtx.fill();

                // Enemigos
                vrHudCtx.fillStyle = '#ff0000';
                enemies.forEach(e => {
                    let ex = (e.mesh.position.x / TILE_SIZE) * cellW;
                    let ez = (e.mesh.position.z / TILE_SIZE) * cellH;
                    vrHudCtx.fillRect(offsetX + ex - 3, offsetY + ez - 3, 6, 6);
                });

                vrHudTex.needsUpdate = true;
            }

            function showGameOverScreen() {
                isGameOver = true;
                isGameRunning = false;
                
                const goCanvas = document.createElement('canvas');
                goCanvas.width = 1024; goCanvas.height = 1024;
                const goCtx = goCanvas.getContext('2d');
                
                goCtx.fillStyle = 'rgba(40, 0, 0, 0.95)';
                goCtx.fillRect(0, 0, 1024, 1024);
                goCtx.strokeStyle = '#ff0000'; 
                goCtx.lineWidth = 15; 
                goCtx.strokeRect(0, 0, 1024, 1024);
                
                goCtx.textAlign = 'center';
                goCtx.fillStyle = '#ff0000';
                goCtx.font = 'bold 120px Courier New';
                goCtx.fillText("KERNEL PANIC", 512, 300);
                
                goCtx.fillStyle = '#ffffff';
                goCtx.font = 'bold 90px Courier New';
                goCtx.fillText(`SCORE FINAL: ${score}`, 512, 500);
                
                goCtx.fillStyle = '#0f0';
                goCtx.font = 'bold 60px Courier New';
                goCtx.fillText("[ DISPARA AQUÍ ]", 512, 750);
                goCtx.fillText("PARA REINICIAR", 512, 850);

                const goTex = new THREE.CanvasTexture(goCanvas);
                const goGeo = new THREE.PlaneGeometry(1.5, 1.5);
                const goMat = new THREE.MeshBasicMaterial({
                    map: goTex, transparent: true, depthTest: false 
                });
                
                gameOverMesh = new THREE.Mesh(goGeo, goMat);
                gameOverMesh.renderOrder = 1000; 
                gameOverMesh.position.set(0, 0, -1.5); 
                camera.add(gameOverMesh);
            }

            function loadDirectory(path) {
                currentPath = path;
                walls.forEach(w => scene.remove(w.mesh)); 
                walls = []; wallMeshes = []; doors = [];
                
                enemies.forEach(e => scene.remove(e.mesh)); enemies = [];
                dyingEnemies.forEach(e => scene.remove(e.mesh)); dyingEnemies = [];
                mapGrid = [];

                for(let z = 0; z < GRID_SIZE; z++) {
                    let row = [];
                    for(let x = 0; x < GRID_SIZE; x++) {
                        if (z === 0 || z === GRID_SIZE - 1 || x === 0 || x === GRID_SIZE - 1) row.push(1); 
                        else if (x > 2 && x < GRID_SIZE-3 && z > 2 && z < GRID_SIZE-3) row.push(Math.random() > 0.8 ? 1 : 0);
                        else row.push(0); 
                    }
                    mapGrid.push(row);
                }

                const cx = Math.floor(GRID_SIZE / 2);
                const cz = Math.floor(GRID_SIZE / 2);
                mapGrid[cz][cx] = 0; mapGrid[cz-1][cx] = 0; mapGrid[cz+1][cx] = 0;
                mapGrid[cz][cx-1] = 0; mapGrid[cz][cx+1] = 0;

                const childrenDirs = fsTree[path] || [];
                const parentDir = path === "/" ? null : path.substring(0, Math.max(path.lastIndexOf('/'), 1));
                
                let spots = [{x: cx, z: 0}, {x: 0, z: cz}, {x: GRID_SIZE-1, z: cz}, {x: cx-3, z: 0}];

                if (parentDir) createDoor(cx, GRID_SIZE-1, parentDir, "..", "#ff0000");
                else mapGrid[GRID_SIZE-1][cx] = 1;

                childrenDirs.forEach((child, i) => {
                    if (i < spots.length) {
                        createDoor(spots[i].x, spots[i].z, path === "/" ? `/${child}` : `${path}/${child}`, child, "#ffff00");
                    }
                });

                const wallGeo = new THREE.BoxGeometry(TILE_SIZE, TILE_SIZE, TILE_SIZE);
                const wallMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
                const solidMat = new THREE.MeshLambertMaterial({ color: 0x002200 });

                for(let z = 0; z < GRID_SIZE; z++) {
                    for(let x = 0; x < GRID_SIZE; x++) {
                        if (mapGrid[z][x] === 1) {
                            const mesh = new THREE.Mesh(wallGeo, solidMat);
                            mesh.add(new THREE.Mesh(wallGeo, wallMat));
                            mesh.position.set(x * TILE_SIZE, TILE_SIZE / 2, z * TILE_SIZE);
                            scene.add(mesh);
                            walls.push({ mesh, box: new THREE.Box3().setFromObject(mesh) });
                            wallMeshes.push(mesh); 
                        }
                    }
                }

                playerDolly.position.set(cx * TILE_SIZE, 0, cz * TILE_SIZE);
                updateHUD(`> cd ${path}`);
            }

            function createDoor(gx, gz, path, label, color) {
                mapGrid[gz][gx] = 2; 
                const doorGeo = new THREE.BoxGeometry(TILE_SIZE, TILE_SIZE, TILE_SIZE);
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#002200'; ctx.fillRect(0,0,512,512);
                ctx.strokeStyle = color; ctx.lineWidth = 20; ctx.strokeRect(0,0,512,512);
                ctx.fillStyle = color; ctx.font = 'bold 60px Courier New'; ctx.textAlign = 'center'; ctx.fillText(`cd ${label}`, 256, 256);
                
                const mesh = new THREE.Mesh(doorGeo, new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) }));
                mesh.position.set(gx * TILE_SIZE, TILE_SIZE / 2, gz * TILE_SIZE);
                scene.add(mesh);
                doors.push({ mesh, box: new THREE.Box3().setFromObject(mesh), targetPath: path });
            }

            function updateFlowField(targetX, targetZ) {
                for(let z=0; z<GRID_SIZE; z++) {
                    for(let x=0; x<GRID_SIZE; x++) { flowField[z][x] = 9999; }
                }
                if (targetX < 0 || targetX >= GRID_SIZE || targetZ < 0 || targetZ >= GRID_SIZE) return;

                let queue = [{x: targetX, z: targetZ, dist: 0}];
                flowField[targetZ][targetX] = 0;
                const dirs = [{x:0,z:-1}, {x:0,z:1}, {x:-1,z:0}, {x:1,z:0}];

                while(queue.length > 0) {
                    let curr = queue.shift();
                    for(let d of dirs) {
                        let nx = curr.x + d.x;
                        let nz = curr.z + d.z;
                        if(nx>=0 && nx<GRID_SIZE && nz>=0 && nz<GRID_SIZE && mapGrid[nz][nx] !== 1) {
                            if(flowField[nz][nx] > curr.dist + 1) {
                                flowField[nz][nx] = curr.dist + 1;
                                queue.push({x: nx, z: nz, dist: curr.dist + 1});
                            }
                        }
                    }
                }
            }

            function startGame() {
                if (gameOverMesh) {
                    camera.remove(gameOverMesh);
                    gameOverMesh = null;
                }
                
                isGameRunning = true; isGameOver = false; health = 100; score = 0; clipAmmo = MAX_CLIP; reserveAmmo = 120; stamina = 100;
                
                if (!bgm.isPlaying) {
                    const audioLoader = new THREE.AudioLoader();
                    audioLoader.load('soundtrack.mp3', function(buffer) {
                        bgm.setBuffer(buffer);
                        bgm.setLoop(true);
                        bgm.setVolume(0.4);
                        bgm.play();
                    }, undefined, function(err) {});
                }

                loadDirectory("/");
                if(!spawnInterval) spawnInterval = setInterval(spawnEnemy, 3000);
            }

            function spawnEnemy() {
                if (!isGameRunning) return;
                const type = weaponTypes[Math.floor(Math.random() * weaponTypes.length)];
                let label = type === 'int' ? '404' : type === 'float' ? '3.14' : type === 'bool' ? 'true' : '"null"';

                let validSpots = [];
                let px = Math.floor(playerDolly.position.x / TILE_SIZE);
                let pz = Math.floor(playerDolly.position.z / TILE_SIZE);

                for(let z=1; z<GRID_SIZE-1; z++){
                    for(let x=1; x<GRID_SIZE-1; x++){
                        if(mapGrid[z][x] === 0 && Math.abs(x-px)>3 && Math.abs(z-pz)>3) validSpots.push({x,z});
                    }
                }
                if(validSpots.length === 0) return;

                const spot = validSpots[Math.floor(Math.random() * validSpots.length)];
                const canvas = document.createElement('canvas');
                canvas.width=256; canvas.height=256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle='#001100'; ctx.fillRect(0,0,256,256);
                ctx.strokeStyle='#0f0'; ctx.lineWidth=10; ctx.strokeRect(0,0,256,256);
                ctx.fillStyle='#0f0'; ctx.font='bold 45px Courier'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label, 128,128);

                const material = new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(canvas)});
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(3,3,3), material);
                mesh.position.set(spot.x * TILE_SIZE, 1.5, spot.z * TILE_SIZE);
                scene.add(mesh);
                enemies.push({ mesh, material, type, box: new THREE.Box3().setFromObject(mesh), speed: 4 + (score*0.1) });
            }

            // --- LÓGICA DE DISPARO COMPARTIDA PARA AMBAS MANOS ---
            function fireWeapon(ctrl, wpnMesh) {
                if (!ctrl || !wpnMesh) return;

                const matrix = new THREE.Matrix4().extractRotation(wpnMesh.matrixWorld);
                const direction = new THREE.Vector3(0, 0, -1).applyMatrix4(matrix);
                const startPos = new THREE.Vector3();
                wpnMesh.getWorldPosition(startPos);
                
                // Reinicio desde Pantalla Game Over (ambas manos funcionan)
                if (isGameOver && gameOverMesh) {
                    const tempLaser = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.02, 0.02, 5, 8).rotateX(Math.PI/2),
                        new THREE.MeshBasicMaterial({ color: 0xff0000 })
                    );
                    tempLaser.position.copy(startPos);
                    tempLaser.lookAt(startPos.clone().add(direction));
                    scene.add(tempLaser);
                    setTimeout(() => scene.remove(tempLaser), 150);
                    playShootSound();

                    const ray = new THREE.Raycaster(startPos, direction);
                    const hits = ray.intersectObject(gameOverMesh);
                    if (hits.length > 0) {
                        startGame();
                    }
                    return;
                }

                if (!isGameRunning || isReloading) return;
                
                if (clipAmmo <= 0) {
                    isReloading = true; updateHUD("> RECARGANDO...");
                    setTimeout(() => { 
                        clipAmmo=MAX_CLIP; reserveAmmo-=MAX_CLIP; isReloading=false; updateHUD();
                    }, 1500);
                    return;
                }

                clipAmmo--; updateHUD();
                playShootSound();
                
                const laser = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.05, 0.05, 1.5, 8).rotateX(Math.PI/2),
                    new THREE.MeshBasicMaterial({ color: weaponColors[weaponTypes[currentWeaponIndex]] })
                );
                laser.position.copy(startPos);
                laser.lookAt(startPos.clone().add(direction));
                scene.add(laser);

                lasers.push({ mesh: laser, dir: direction, speed: 70, type: weaponTypes[currentWeaponIndex], box: new THREE.Box3() });
            }

            function switchWeapon() {
                currentWeaponIndex += 1;
                if(currentWeaponIndex >= weaponTypes.length) currentWeaponIndex = 0;
                
                if (weaponMat) {
                    const hex = weaponColors[weaponTypes[currentWeaponIndex]];
                    weaponMat.color.setHex(hex); weaponMat.emissive.setHex(hex);
                }
                updateHUD();
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function animate() {
                const delta = clock.getDelta();
                const time = clock.getElapsedTime();
                
                if (!isGameRunning) { 
                    renderer.render(scene, camera); 
                    return; 
                }

                const session = renderer.xr.getSession();
                if (session) {
                    if(weaponSwitchCooldown > 0) weaponSwitchCooldown -= delta;

                    for (const source of session.inputSources) {
                        if (source.gamepad) {
                            
                            let axX = 0, axY = 0;
                            if (source.gamepad.axes.length >= 4) {
                                axX = source.gamepad.axes[2]; 
                                axY = source.gamepad.axes[3]; 
                            } else if (source.gamepad.axes.length >= 2) {
                                axX = source.gamepad.axes[0];
                                axY = source.gamepad.axes[1];
                            }

                            if (Math.abs(axX) < 0.2) axX = 0;
                            if (Math.abs(axY) < 0.2) axY = 0;

                            if (source.handedness === 'left') {
                                // CORRER CON BOTÓN GRIP (Índice 1 en mandos de Meta)
                                let isSprinting = false;
                                if (source.gamepad.buttons[1] && source.gamepad.buttons[1].pressed && stamina > 0) {
                                    isSprinting = true;
                                    stamina -= 35 * delta;
                                    if(stamina < 0) stamina = 0;
                                } else {
                                    stamina += 20 * delta; 
                                    if(stamina > MAX_STAMINA) stamina = MAX_STAMINA;
                                }

                                if (axX !== 0 || axY !== 0) {
                                    const moveSpeed = (isSprinting && stamina > 0 ? 11 : 6) * delta;
                                    
                                    const fwDir = new THREE.Vector3();
                                    camera.getWorldDirection(fwDir);
                                    fwDir.y = 0; 
                                    fwDir.normalize();
                                    const rtDir = new THREE.Vector3().copy(fwDir).cross(camera.up).normalize();

                                    const moveVec = new THREE.Vector3();
                                    moveVec.addScaledVector(fwDir, -axY * moveSpeed);
                                    moveVec.addScaledVector(rtDir, axX * moveSpeed);

                                    const px = playerDolly.position.x + moveVec.x;
                                    const pz = playerDolly.position.z + moveVec.z;
                                    
                                    const pBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(px, 1, pz), new THREE.Vector3(2,2,2));
                                    if(!walls.some(w => pBox.intersectsBox(w.box))) {
                                        playerDolly.position.x = px;
                                        playerDolly.position.z = pz;
                                    }
                                }
                            }
                            
                            if (source.handedness === 'right') {
                                // ROTACIÓN DE CÁMARA (Giro Suave)
                                if (axX !== 0) {
                                    playerDolly.rotation.y -= axX * 2.5 * delta;
                                }

                                // CAMBIO DE ARMA (Botón A / B o presionar Joystick adentro)
                                const aPressed = source.gamepad.buttons[4] && source.gamepad.buttons[4].pressed;
                                const bPressed = source.gamepad.buttons[5] && source.gamepad.buttons[5].pressed;
                                const thumbPressed = source.gamepad.buttons[3] && source.gamepad.buttons[3].pressed;

                                if ((aPressed || bPressed || thumbPressed) && weaponSwitchCooldown <= 0) {
                                    switchWeapon(); 
                                    weaponSwitchCooldown = 0.5;
                                }
                            }
                        }
                    }
                }

                if (time - lastHudUpdate > 0.1) {
                    updateHUD();
                    lastHudUpdate = time;
                }

                for(let d of doors) {
                    if (playerDolly.position.distanceTo(d.mesh.position) < TILE_SIZE / 1.5) {
                        loadDirectory(d.targetPath); break;
                    }
                }

                for (let i = lasers.length - 1; i >= 0; i--) {
                    let l = lasers[i];
                    l.mesh.position.addScaledVector(l.dir, l.speed * delta);
                    l.box.setFromObject(l.mesh);
                    
                    let hit = walls.some(w => l.box.intersectsBox(w.box));
                    
                    if (!hit) {
                        for (let j = enemies.length - 1; j >= 0; j--) {
                            let e = enemies[j];
                            if (l.box.intersectsBox(e.box)) {
                                hit = true;
                                if (l.type === e.type) {
                                    e.deathTimer = 1.0;
                                    e.material.color.setHex(0xff0000); 
                                    dyingEnemies.push(e);
                                    enemies.splice(j, 1);
                                    score++; updateHUD();
                                } else {
                                    updateHUD("ERROR DE TIPO!");
                                }
                                break;
                            }
                        }
                    }
                    if (hit || l.mesh.position.distanceTo(playerDolly.position) > 100) {
                        scene.remove(l.mesh); lasers.splice(i, 1);
                    }
                }

                for (let i = dyingEnemies.length - 1; i >= 0; i--) {
                    const e = dyingEnemies[i];
                    e.deathTimer -= delta * 2;
                    e.mesh.rotation.y += 15 * delta; 
                    e.mesh.rotation.x += 10 * delta;
                    e.mesh.scale.setScalar(Math.max(0.01, e.deathTimer)); 
                    
                    if (e.deathTimer <= 0) {
                        scene.remove(e.mesh);
                        dyingEnemies.splice(i, 1);
                    }
                }

                if (time - lastFlowFieldUpdate > 0.3) {
                    let px = Math.floor(playerDolly.position.x / TILE_SIZE);
                    let pz = Math.floor(playerDolly.position.z / TILE_SIZE);
                    updateFlowField(px, pz);
                    lastFlowFieldUpdate = time;
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    e.mesh.lookAt(playerDolly.position.x, e.mesh.position.y, playerDolly.position.z);
                    
                    let dirToPlayer = new THREE.Vector3().subVectors(playerDolly.position, e.mesh.position);
                    let distToPlayer = dirToPlayer.length();
                    
                    let dir = new THREE.Vector3();
                    let hasLOS = false; 

                    if (distToPlayer < 30) {
                        let ray = new THREE.Raycaster(e.mesh.position, dirToPlayer.clone().normalize(), 0, distToPlayer);
                        let hits = ray.intersectObjects(wallMeshes);
                        if (hits.length === 0) hasLOS = true;
                    }

                    if (hasLOS) {
                        dir.copy(dirToPlayer);
                    } else {
                        let ex = Math.floor(e.mesh.position.x / TILE_SIZE);
                        let ez = Math.floor(e.mesh.position.z / TILE_SIZE);
                        
                        let bestDist = (flowField[ez] && flowField[ez][ex] !== undefined) ? flowField[ez][ex] : 9999;
                        let bestX = ex, bestZ = ez;
                        const dirs = [{x:0,z:-1}, {x:0,z:1}, {x:-1,z:0}, {x:1,z:0}];
                        
                        for(let d of dirs) {
                            let nx = ex + d.x;
                            let nz = ez + d.z;
                            if(nx>=0 && nx<GRID_SIZE && nz>=0 && nz<GRID_SIZE && mapGrid[nz][nx] !== 1) {
                                if(flowField[nz][nx] < bestDist) {
                                    bestDist = flowField[nz][nx];
                                    bestX = nx; bestZ = nz;
                                }
                            }
                        }
                        
                        let targetPos = new THREE.Vector3(bestX * TILE_SIZE, e.mesh.position.y, bestZ * TILE_SIZE);
                        dir.subVectors(targetPos, e.mesh.position);
                        if (dir.length() < 1.0) dir.copy(dirToPlayer); 
                    }

                    dir.y = 0;
                    if (dir.length() > 0) dir.normalize();

                    const prevX = e.mesh.position.x;
                    const prevZ = e.mesh.position.z;

                    e.mesh.position.x += dir.x * e.speed * delta;
                    e.box.setFromObject(e.mesh);
                    if (walls.some(w => e.box.intersectsBox(w.box))) e.mesh.position.x = prevX;

                    e.mesh.position.z += dir.z * e.speed * delta;
                    e.box.setFromObject(e.mesh);
                    if (walls.some(w => e.box.intersectsBox(w.box))) e.mesh.position.z = prevZ;

                    if (distToPlayer < 3.5 && isGameRunning) {
                        health -= 15; 
                        
                        if (health <= 0) { 
                            showGameOverScreen(); 
                        } else {
                            updateHUD("¡SISTEMA DAÑADO!");
                        }
                        
                        e.mesh.position.addScaledVector(dir, -5); 
                    }
                }
                renderer.render(scene, camera);
            }
        } catch (error) {
            document.getElementById('error-log').innerText = "❌ Falla de ejecución: " + error.message;
            console.error(error);
        }
    </script>
</body>
</html>
