<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UNIX DOOM VR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #info {
            text-align: center;
            z-index: 10;
            background: rgba(0, 20, 0, 0.8);
            padding: 30px;
            border: 2px solid #0f0;
            border-radius: 10px;
        }
        h1 { text-shadow: 0 0 10px #0f0; }
        p { max-width: 600px; line-height: 1.5; font-size: 18px; }
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #error-log { color: #ff0000; font-weight: bold; margin-top: 20px; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">
        <h1>UNIX DOOM VR</h1>
        <p>> <b>Mando Izquierdo:</b> Joystick para moverte. <b>Mantén el gatillo para correr.</b> Mírate la muñeca para la UI.</p>
        <p>> <b>Mando Derecho:</b> Gatillo para disparar. Joystick Izq/Der para cambiar de arma.</p>
        <div id="error-log"></div>
    </div>

    <div id="game-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        try {
            // --- VARIABLES GLOBALES ---
            const fsTree = {
                "/": ["bin", "etc", "home", "var"],
                "/bin": ["bash", "ls"], "/etc": ["ssh", "config"],
                "/home": ["hacker"], "/home/hacker": ["scripts", "payloads"],
                "/var": ["log"]
            };

            let camera, scene, renderer;
            let playerDolly;
            let rightController = null;
            let leftController = null;
            
            let health = 100;
            let score = 0;
            let isGameOver = false;
            let isGameRunning = false;

            let clipAmmo = 30;
            const MAX_CLIP = 30;
            let reserveAmmo = 60;
            let isReloading = false;

            let currentPath = "/";
            const weaponTypes = ['int', 'float', 'string', 'bool'];
            let currentWeaponIndex = 0;
            let weaponSwitchCooldown = 0;
            
            const weaponColors = {
                'int': 0x00ff00, 'float': 0x00ffff, 
                'string': 0xffff00, 'bool': 0xaa00ff
            };

            let mapGrid = [];
            const TILE_SIZE = 10;
            const GRID_SIZE = 15;
            let walls = [], doors = [], enemies = [], lasers = [];
            let spawnInterval;

            // --- VARIABLES DE PATHFINDING ---
            let flowField = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(9999));
            let lastFlowFieldUpdate = 0;

            const clock = new THREE.Clock();

            // UI
            const hudCanvas = document.createElement('canvas');
            hudCanvas.width = 512; hudCanvas.height = 256;
            const vrHudCtx = hudCanvas.getContext('2d');
            const vrHudTex = new THREE.CanvasTexture(hudCanvas);
            let vrHudMesh, weaponMesh, weaponMat;

            // AUDIO GLOBALES
            let audioCtx;
            let listener;
            let bgm;

            init();

            function init() {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x000a00);
                scene.fog = new THREE.FogExp2(0x001100, 0.015); // Niebla más ligera

                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 1.6, 0);

                // ILUMINACIÓN AUMENTADA
                const ambientLight = new THREE.AmbientLight(0x00aa00, 1.2); // Más brillo ambiental
                scene.add(ambientLight);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.xr.enabled = true;
                document.getElementById('game-container').appendChild(renderer.domElement);
                
                const vrButton = VRButton.createButton(renderer);
                vrButton.addEventListener('click', () => {
                    document.getElementById('info').style.display = 'none';
                    if(!isGameRunning) startGame();
                });
                document.body.appendChild(vrButton);

                playerDolly = new THREE.Group();
                scene.add(playerDolly);
                playerDolly.add(camera);

                // LUZ PERSONAL (Linterna atada al jugador)
                const pointLight = new THREE.PointLight(0x00ff00, 1.5, 40);
                pointLight.position.set(0, 2, 0);
                playerDolly.add(pointLight);

                // SISTEMA DE AUDIO (Preparación)
                listener = new THREE.AudioListener();
                camera.add(listener);
                bgm = new THREE.Audio(listener);

                // MANDOS
                const onControllerConnected = (event) => {
                    const controller = event.target;
                    const handedness = event.data.handedness;

                    if (handedness === 'right') {
                        rightController = controller;
                        buildRightController(rightController);
                        rightController.addEventListener('selectstart', onTriggerDown); 
                    } else if (handedness === 'left') {
                        leftController = controller;
                        buildLeftController(leftController);
                    }
                };

                const controller1 = renderer.xr.getController(0);
                controller1.addEventListener('connected', onControllerConnected);
                playerDolly.add(controller1);

                const controller2 = renderer.xr.getController(1);
                controller2.addEventListener('connected', onControllerConnected);
                playerDolly.add(controller2);

                buildEnvironment();
                updateHUD("SISTEMA INICIADO");

                window.addEventListener('resize', onWindowResize);
                renderer.setAnimationLoop(animate);
            }

            // --- AUDIO SINTETIZADOR LÁSER ---
            function playShootSound() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'square';
                // Efecto "Pew" (caída rápida de frecuencia)
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }

            function buildRightController(ctrl) {
                const laserGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -50)
                ]);
                const laserMat = new THREE.LineBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
                const aimLine = new THREE.Line(laserGeo, laserMat);
                ctrl.add(aimLine);

                weaponMesh = new THREE.Group();
                const gunDarkMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
                weaponMat = new THREE.MeshLambertMaterial({ color: weaponColors['int'], emissive: weaponColors['int'], emissiveIntensity: 0.8 });
                
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.3), gunDarkMat);
                const core = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.03, 0.15), weaponMat);
                core.position.set(0, 0.06, -0.05);
                weaponMesh.add(body); weaponMesh.add(core);
                
                weaponMesh.position.set(0, -0.05, -0.1);
                weaponMesh.rotation.x = -Math.PI / 6;
                ctrl.add(weaponMesh);
            }

            function buildLeftController(ctrl) {
                const hudGeo = new THREE.PlaneGeometry(0.2, 0.1);
                const hudMat = new THREE.MeshBasicMaterial({ map: vrHudTex, transparent: true, side: THREE.DoubleSide });
                vrHudMesh = new THREE.Mesh(hudGeo, hudMat);
                
                vrHudMesh.position.set(0, 0.05, -0.1);
                vrHudMesh.rotation.x = -Math.PI / 4;
                ctrl.add(vrHudMesh);
            }

            function buildEnvironment() {
                const gridGeo = new THREE.PlaneGeometry(GRID_SIZE * TILE_SIZE, GRID_SIZE * TILE_SIZE, GRID_SIZE, GRID_SIZE);
                const gridMat = new THREE.MeshBasicMaterial({ color: 0x003300, wireframe: true });
                
                const floor = new THREE.Mesh(gridGeo, gridMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.set((GRID_SIZE * TILE_SIZE)/2 - TILE_SIZE/2, 0, (GRID_SIZE * TILE_SIZE)/2 - TILE_SIZE/2);
                scene.add(floor);

                const ceiling = new THREE.Mesh(gridGeo, gridMat);
                ceiling.rotation.x = Math.PI / 2;
                ceiling.position.set((GRID_SIZE * TILE_SIZE)/2 - TILE_SIZE/2, TILE_SIZE, (GRID_SIZE * TILE_SIZE)/2 - TILE_SIZE/2);
                scene.add(ceiling);
            }

            function updateHUD(message = "") {
                vrHudCtx.fillStyle = 'rgba(0, 20, 0, 0.9)';
                vrHudCtx.fillRect(0, 0, 512, 256);
                
                vrHudCtx.strokeStyle = '#' + weaponColors[weaponTypes[currentWeaponIndex]].toString(16).padStart(6,'0');
                vrHudCtx.lineWidth = 10;
                vrHudCtx.strokeRect(0, 0, 512, 256);

                vrHudCtx.fillStyle = '#0f0';
                vrHudCtx.font = 'bold 40px Courier New';
                vrHudCtx.fillText(`HP: ${health}%`, 20, 60);
                vrHudCtx.fillText(`KILLS: ${score}`, 250, 60);
                
                vrHudCtx.fillStyle = '#0ff';
                vrHudCtx.fillText(`AMMO: ${clipAmmo}/${reserveAmmo}`, 20, 120);

                vrHudCtx.fillStyle = vrHudCtx.strokeStyle;
                vrHudCtx.fillText(`ARMA: [${weaponTypes[currentWeaponIndex].toUpperCase()}]`, 20, 180);

                if(message) {
                    vrHudCtx.fillStyle = '#ffaa00';
                    vrHudCtx.font = 'bold 30px Courier New';
                    vrHudCtx.fillText(message, 20, 230);
                }
                vrHudTex.needsUpdate = true;
            }

            // --- LÓGICA DE PATHFINDING ---
            function updateFlowField(targetX, targetZ) {
                for(let z=0; z<GRID_SIZE; z++) {
                    for(let x=0; x<GRID_SIZE; x++) {
                        flowField[z][x] = 9999;
                    }
                }
                if (targetX < 0 || targetX >= GRID_SIZE || targetZ < 0 || targetZ >= GRID_SIZE) return;

                let queue = [{x: targetX, z: targetZ, dist: 0}];
                flowField[targetZ][targetX] = 0;
                const dirs = [{x:0,z:-1}, {x:0,z:1}, {x:-1,z:0}, {x:1,z:0}];

                while(queue.length > 0) {
                    let curr = queue.shift();
                    for(let d of dirs) {
                        let nx = curr.x + d.x;
                        let nz = curr.z + d.z;
                        if(nx>=0 && nx<GRID_SIZE && nz>=0 && nz<GRID_SIZE && mapGrid[nz][nx] !== 1) {
                            if(flowField[nz][nx] > curr.dist + 1) {
                                flowField[nz][nx] = curr.dist + 1;
                                queue.push({x: nx, z: nz, dist: curr.dist + 1});
                            }
                        }
                    }
                }
            }

            function loadDirectory(path) {
                currentPath = path;
                walls.forEach(w => scene.remove(w.mesh)); walls = [];
                doors.forEach(d => scene.remove(d.mesh)); doors = [];
                enemies.forEach(e => scene.remove(e.mesh)); enemies = [];
                mapGrid = [];

                for(let z = 0; z < GRID_SIZE; z++) {
                    let row = [];
                    for(let x = 0; x < GRID_SIZE; x++) {
                        if (z === 0 || z === GRID_SIZE - 1 || x === 0 || x === GRID_SIZE - 1) row.push(1); 
                        else if (x > 2 && x < GRID_SIZE-3 && z > 2 && z < GRID_SIZE-3) row.push(Math.random() > 0.8 ? 1 : 0);
                        else row.push(0); 
                    }
                    mapGrid.push(row);
                }

                const cx = Math.floor(GRID_SIZE / 2);
                const cz = Math.floor(GRID_SIZE / 2);
                mapGrid[cz][cx] = 0; mapGrid[cz-1][cx] = 0; mapGrid[cz+1][cx] = 0;
                mapGrid[cz][cx-1] = 0; mapGrid[cz][cx+1] = 0;

                const childrenDirs = fsTree[path] || [];
                const parentDir = path === "/" ? null : path.substring(0, Math.max(path.lastIndexOf('/'), 1));
                
                let spots = [{x: cx, z: 0}, {x: 0, z: cz}, {x: GRID_SIZE-1, z: cz}, {x: cx-3, z: 0}];

                if (parentDir) createDoor(cx, GRID_SIZE-1, parentDir, "..", "#ff0000");
                else mapGrid[GRID_SIZE-1][cx] = 1;

                childrenDirs.forEach((child, i) => {
                    if (i < spots.length) {
                        createDoor(spots[i].x, spots[i].z, path === "/" ? `/${child}` : `${path}/${child}`, child, "#ffff00");
                    }
                });

                const wallGeo = new THREE.BoxGeometry(TILE_SIZE, TILE_SIZE, TILE_SIZE);
                const wallMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
                const solidMat = new THREE.MeshLambertMaterial({ color: 0x002200 });

                for(let z = 0; z < GRID_SIZE; z++) {
                    for(let x = 0; x < GRID_SIZE; x++) {
                        if (mapGrid[z][x] === 1) {
                            const mesh = new THREE.Mesh(wallGeo, solidMat);
                            mesh.add(new THREE.Mesh(wallGeo, wallMat));
                            mesh.position.set(x * TILE_SIZE, TILE_SIZE / 2, z * TILE_SIZE);
                            scene.add(mesh);
                            walls.push({ mesh, box: new THREE.Box3().setFromObject(mesh) });
                        }
                    }
                }

                playerDolly.position.set(cx * TILE_SIZE, 0, cz * TILE_SIZE);
                updateHUD(`> cd ${path}`);
            }

            function createDoor(gx, gz, path, label, color) {
                mapGrid[gz][gx] = 2; 
                const doorGeo = new THREE.BoxGeometry(TILE_SIZE, TILE_SIZE, TILE_SIZE);
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#002200'; ctx.fillRect(0,0,512,512);
                ctx.strokeStyle = color; ctx.lineWidth = 20; ctx.strokeRect(0,0,512,512);
                ctx.fillStyle = color; ctx.font = 'bold 60px Courier New'; ctx.textAlign = 'center'; ctx.fillText(`cd ${label}`, 256, 256);
                
                const mesh = new THREE.Mesh(doorGeo, new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) }));
                mesh.position.set(gx * TILE_SIZE, TILE_SIZE / 2, gz * TILE_SIZE);
                scene.add(mesh);
                doors.push({ mesh, box: new THREE.Box3().setFromObject(mesh), targetPath: path });
            }

            function startGame() {
                isGameRunning = true; isGameOver = false; health = 100; score = 0; clipAmmo = MAX_CLIP;
                
                // CARGAR CANCIÓN DE FONDO
                if (!bgm.isPlaying) {
                    const audioLoader = new THREE.AudioLoader();
                    audioLoader.load('soundtrack.mp3', function(buffer) {
                        bgm.setBuffer(buffer);
                        bgm.setLoop(true);
                        bgm.setVolume(0.4);
                        bgm.play();
                    }, undefined, function(err) {
                        console.warn("No se encontró soundtrack.mp3 en la misma carpeta.");
                    });
                }

                loadDirectory("/");
                if(!spawnInterval) spawnInterval = setInterval(spawnEnemy, 3000);
            }

            function spawnEnemy() {
                if (!isGameRunning) return;
                const type = weaponTypes[Math.floor(Math.random() * weaponTypes.length)];
                let label = type === 'int' ? '404' : type === 'float' ? '3.14' : type === 'bool' ? 'true' : '"null"';

                let validSpots = [];
                let px = Math.floor(playerDolly.position.x / TILE_SIZE);
                let pz = Math.floor(playerDolly.position.z / TILE_SIZE);

                for(let z=1; z<GRID_SIZE-1; z++){
                    for(let x=1; x<GRID_SIZE-1; x++){
                        if(mapGrid[z][x] === 0 && Math.abs(x-px)>3 && Math.abs(z-pz)>3) validSpots.push({x,z});
                    }
                }
                if(validSpots.length === 0) return;

                const spot = validSpots[Math.floor(Math.random() * validSpots.length)];
                const canvas = document.createElement('canvas');
                canvas.width=256; canvas.height=256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle='#001100'; ctx.fillRect(0,0,256,256);
                ctx.strokeStyle='#0f0'; ctx.lineWidth=10; ctx.strokeRect(0,0,256,256);
                ctx.fillStyle='#0f0'; ctx.font='bold 45px Courier'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label, 128,128);

                const mesh = new THREE.Mesh(new THREE.BoxGeometry(3,3,3), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(canvas)}));
                mesh.position.set(spot.x * TILE_SIZE, 1.5, spot.z * TILE_SIZE);
                scene.add(mesh);
                enemies.push({ mesh, type, box: new THREE.Box3().setFromObject(mesh), speed: 3 + (score*0.1) });
            }

            function onTriggerDown() {
                if (!isGameRunning || isReloading || !rightController) return;
                
                if (clipAmmo <= 0) {
                    isReloading = true; updateHUD("> RECARGANDO...");
                    setTimeout(() => { 
                        clipAmmo=MAX_CLIP; reserveAmmo-=MAX_CLIP; isReloading=false; updateHUD();
                    }, 1500);
                    return;
                }

                clipAmmo--; updateHUD();
                
                // SONIDO
                playShootSound();

                const matrix = new THREE.Matrix4().extractRotation(rightController.matrixWorld);
                const direction = new THREE.Vector3(0, 0, -1).applyMatrix4(matrix);
                
                const startPos = new THREE.Vector3();
                weaponMesh.getWorldPosition(startPos);

                const laser = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.05, 0.05, 1.5, 8).rotateX(Math.PI/2),
                    new THREE.MeshBasicMaterial({ color: weaponColors[weaponTypes[currentWeaponIndex]] })
                );
                laser.position.copy(startPos);
                laser.lookAt(startPos.clone().add(direction));
                scene.add(laser);

                lasers.push({ mesh: laser, dir: direction, speed: 60, type: weaponTypes[currentWeaponIndex], box: new THREE.Box3() });
            }

            function switchWeapon(dir) {
                currentWeaponIndex += dir;
                if(currentWeaponIndex >= weaponTypes.length) currentWeaponIndex = 0;
                if(currentWeaponIndex < 0) currentWeaponIndex = weaponTypes.length - 1;
                
                if (weaponMat) {
                    const hex = weaponColors[weaponTypes[currentWeaponIndex]];
                    weaponMat.color.setHex(hex); weaponMat.emissive.setHex(hex);
                }
                updateHUD();
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function animate() {
                const delta = clock.getDelta();
                const time = clock.getElapsedTime();
                if (!isGameRunning) { renderer.render(scene, camera); return; }

                const session = renderer.xr.getSession();
                if (session) {
                    if(weaponSwitchCooldown > 0) weaponSwitchCooldown -= delta;

                    for (const source of session.inputSources) {
                        if (source.gamepad) {
                            
                            let axX = 0, axY = 0;
                            if (source.gamepad.axes.length >= 4) {
                                axX = source.gamepad.axes[2]; 
                                axY = source.gamepad.axes[3]; 
                            } else if (source.gamepad.axes.length >= 2) {
                                axX = source.gamepad.axes[0];
                                axY = source.gamepad.axes[1];
                            }

                            if (Math.abs(axX) < 0.2) axX = 0;
                            if (Math.abs(axY) < 0.2) axY = 0;

                            if (source.handedness === 'left') {
                                if (axX !== 0 || axY !== 0) {
                                    // CHECAR GATILLO PARA CORRER
                                    let isSprinting = false;
                                    if (source.gamepad.buttons[0] && source.gamepad.buttons[0].pressed) {
                                        isSprinting = true;
                                    }

                                    const moveSpeed = (isSprinting ? 22 : 9) * delta;
                                    
                                    const fwDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                                    fwDir.y = 0; fwDir.normalize();
                                    const rtDir = new THREE.Vector3().copy(fwDir).cross(camera.up).normalize();

                                    const px = playerDolly.position.x + (-axY * fwDir.x + axX * rtDir.x) * moveSpeed;
                                    const pz = playerDolly.position.z + (-axY * fwDir.z + axX * rtDir.z) * moveSpeed;
                                    
                                    const pBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(px, 1, pz), new THREE.Vector3(2,2,2));
                                    if(!walls.some(w => pBox.intersectsBox(w.box))) {
                                        playerDolly.position.x = px;
                                        playerDolly.position.z = pz;
                                    }
                                }
                            }
                            
                            if (source.handedness === 'right' && weaponSwitchCooldown <= 0) {
                                if (axX > 0.5) { switchWeapon(1); weaponSwitchCooldown = 0.5; }
                                else if (axX < -0.5) { switchWeapon(-1); weaponSwitchCooldown = 0.5; }
                            }
                        }
                    }
                }

                for(let d of doors) {
                    if (playerDolly.position.distanceTo(d.mesh.position) < TILE_SIZE / 1.5) {
                        loadDirectory(d.targetPath); break;
                    }
                }

                for (let i = lasers.length - 1; i >= 0; i--) {
                    let l = lasers[i];
                    l.mesh.position.addScaledVector(l.dir, l.speed * delta);
                    l.box.setFromObject(l.mesh);
                    
                    let hit = walls.some(w => l.box.intersectsBox(w.box));
                    
                    if (!hit) {
                        for (let j = enemies.length - 1; j >= 0; j--) {
                            let e = enemies[j];
                            if (l.box.intersectsBox(e.box)) {
                                hit = true;
                                if (l.type === e.type) {
                                    scene.remove(e.mesh); enemies.splice(j, 1);
                                    score++; updateHUD();
                                } else {
                                    updateHUD("ERROR DE TIPO!");
                                }
                                break;
                            }
                        }
                    }
                    if (hit || l.mesh.position.distanceTo(playerDolly.position) > 100) {
                        scene.remove(l.mesh); lasers.splice(i, 1);
                    }
                }

                // ACTUALIZAR PATHFINDING (Flow Field)
                if (time - lastFlowFieldUpdate > 0.25) { // Cada cuarto de segundo
                    let px = Math.floor(playerDolly.position.x / TILE_SIZE);
                    let pz = Math.floor(playerDolly.position.z / TILE_SIZE);
                    updateFlowField(px, pz);
                    lastFlowFieldUpdate = time;
                }

                // INTELIGENCIA Y FÍSICA DE ENEMIGOS
                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    e.mesh.lookAt(playerDolly.position.x, e.mesh.position.y, playerDolly.position.z);
                    
                    let ex = Math.floor(e.mesh.position.x / TILE_SIZE);
                    let ez = Math.floor(e.mesh.position.z / TILE_SIZE);
                    let px = Math.floor(playerDolly.position.x / TILE_SIZE);
                    let pz = Math.floor(playerDolly.position.z / TILE_SIZE);

                    let dir = new THREE.Vector3();

                    // Si está al lado tuyo, ataca directo
                    if (Math.abs(ex - px) <= 1 && Math.abs(ez - pz) <= 1) {
                        dir.subVectors(playerDolly.position, e.mesh.position);
                    } else {
                        // Seguir el Flow Field
                        let bestDist = (flowField[ez] && flowField[ez][ex] !== undefined) ? flowField[ez][ex] : 9999;
                        let bestX = ex, bestZ = ez;
                        const dirs = [{x:0,z:-1}, {x:0,z:1}, {x:-1,z:0}, {x:1,z:0}];
                        
                        for(let d of dirs) {
                            let nx = ex + d.x;
                            let nz = ez + d.z;
                            if(nx>=0 && nx<GRID_SIZE && nz>=0 && nz<GRID_SIZE && mapGrid[nz][nx] !== 1) {
                                if(flowField[nz][nx] < bestDist) {
                                    bestDist = flowField[nz][nx];
                                    bestX = nx; bestZ = nz;
                                }
                            }
                        }
                        
                        let targetPos = new THREE.Vector3(bestX * TILE_SIZE, e.mesh.position.y, bestZ * TILE_SIZE);
                        dir.subVectors(targetPos, e.mesh.position);
                        
                        // Si ya está casi en el centro del cuadro, que vaya por ti
                        if (dir.length() < 1.0) {
                            dir.subVectors(playerDolly.position, e.mesh.position);
                        }
                    }

                    dir.y = 0;
                    if (dir.length() > 0) dir.normalize();

                    // --- COLISIONES DE ENEMIGOS CONTRA PAREDES ---
                    const prevX = e.mesh.position.x;
                    const prevZ = e.mesh.position.z;

                    e.mesh.position.x += dir.x * e.speed * delta;
                    e.box.setFromObject(e.mesh);
                    if (walls.some(w => e.box.intersectsBox(w.box))) {
                        e.mesh.position.x = prevX; // Bloqueado en X
                    }

                    e.mesh.position.z += dir.z * e.speed * delta;
                    e.box.setFromObject(e.mesh);
                    if (walls.some(w => e.box.intersectsBox(w.box))) {
                        e.mesh.position.z = prevZ; // Bloqueado en Z
                    }

                    // DAÑO AL JUGADOR
                    if (playerDolly.position.distanceTo(e.mesh.position) < 3.5) {
                        health -= 15; updateHUD("¡SISTEMA DAÑADO!");
                        scene.remove(e.mesh); enemies.splice(i, 1);
                        if (health <= 0) { isGameRunning = false; updateHUD("KERNEL PANIC"); }
                    }
                }
                renderer.render(scene, camera);
            }
        } catch (error) {
            document.getElementById('error-log').innerText = "❌ Falla de ejecución: " + error.message;
            console.error(error);
        }
    </script>
</body>
